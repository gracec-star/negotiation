h:["面对面时：倒吸一口气、表情明显变化。","电话里同样有效：惊讶地停顿，重复对方的数字。","邮件里：用文字表达意外，比如「这远低于我们的预期，甚至低于材料成本」。","不要因为觉得幼稚或丢面子就不做，先试过再判断。"],
e:"街头画像师先说15美元；你没反应，他接着说上色加5美元；你还没反应，他又推荐包装纸筒。一位演讲者被培训主管告知最多付1500美元，他惊讶地说「1500？这个价我做不了」，对方当场改口说最多给过2500美元。",
r:"自己也要习惯别人对你吃惊，那常常只是一种招数。",
s:"买家来信：如果能做到US$1.90，就下5000件。你的成本是US$1.70。",
p:"Honestly, US$1.90 came as a surprise. That is well below what this specification normally sells for. Could you share the quality level you are comparing against?",
k:["对方在观察你的反应","不吃惊 → 等于告诉对方有可能","吃惊之后常有让步","电话、邮件也能表达吃惊"],
q:["为什么要对对方的提议表现吃惊？",["为了让对方难堪","因为对方常常只是试探，你没反应他就会坚持","为了拖延时间","为了显得专业"],1,"对方可能根本没指望你答应，你的反应决定了他接下来会不会更强硬。"]},

{n:4,zh:"我理解您的感受。很多客户第一次比价时也有同样的感觉。但他们测试过我们的样品后发现，更低的次品率帮他们省下的钱比价差还多。",t:"避免对抗性谈判",
c:"开局阶段不要和对方争辩，先认同，再扭转。",
w:"开头几分钟决定整场谈判的气氛。争辩只会激起对方证明自己是对的的欲望，就像你推别人的手掌，他会本能地推回来。",
h:["用「感受—感觉—发现」公式：我理解你的感受；很多人一开始也有同样的感觉；但仔细看过后他们发现……","听到「太贵了」「你们发货有问题」「我不买进口货」这类话时，都可以套这个公式。","这个公式还能帮你在被突然攻击时争取思考时间，说完前半句，你就想好后半句了。"],
e:"作者给一群医疗诉讼律师上课，模拟谈判中他们一开口就是威胁，越谈越凶。作者叫停并提醒他们：真想和解，就不要在早期对抗。",
r:"",
s:"买家说：你们的价格比另一家贵15%。",
p:"I understand how you feel. Many of our customers felt the same way when they first compared prices. What they found after testing our samples was that the lower defect rate saved them more than the price difference.",
k:["早期争辩会制造对抗","感受—感觉—发现公式","公式能给你思考时间"],
q:["对方说「你们的价格太高了」，以下哪种回应最符合本章？",["我们的价格一点也不高","我理解你的感受，很多客户一开始也这么觉得，后来他们发现……","那你去找便宜的吧","我们可以马上降10%"],1,"先认同再扭转，避免把对方推到必须证明自己是对的的位置。"]},

{n:5,zh:"我不确定价格上还有多少弹性，但如果您告诉我怎样才能拿下这笔生意，我会把它带给我们的管理层，看看能为您争取到什么。",t:"不情愿的卖家和买家",
c:"卖东西时显得不太想卖，买东西时显得不太想买。",
w:"表现得不情愿，会在正式谈判开始前就挤压对方的心理价位区间。对方原本心里想着2万到3万，你一表现不情愿，他可能直接从中间甚至最高点开始出价。被这样对待的人，通常会主动让出一半谈判空间。",
h:["卖方：先称赞东西多好、你多舍不得，然后说「为了对你公平，你最高能出多少？」","买方：让对方把介绍全讲完，问完所有问题，然后说不合适；等对方收拾东西要走时，再说「为了对你公平，你最低能给多少？」","第一次报价通常是「愿望价」，不是对方的「离场价」。"],
e:"在码头擦船的船主遇到想买船的富人，与其心中狂喜，不如说「我没想过卖」，带他参观时不停说自己多喜欢这条船，最后问「为了公平，你最高能出多少？」。书里还提到一位地产商在急需现金时依然装作不舍，最后以远高于买入价的价格卖掉了一家酒店。",
r:"对方对你用这招时，按顺序回应：「我觉得价格没什么弹性，但你告诉我怎样才能拿下这笔生意（让对方先表态），我去和我们的人商量（请示上级），看能为你争取到什么（白脸黑脸）。」",
s:"一个新买家表现得很冷淡：「我们其实对现在的供应商挺满意，你们的最低价是多少？」",
p:"I am not sure there is much flexibility in our price, but if you tell me what it would take to earn your business, I will take it to our management and see what I can do for you.",
k:["卖时显得不情愿，买时也一样","能在开谈前挤压对方区间","对方常因此让出一半空间","被用时：让对方先表态 → 请示上级 → 白脸黑脸"],
q:["买家冷淡地问「你们的最低价是多少？」，最好的回应是？",["马上报出底价表示诚意","请对方说出怎样才能拿下订单，并表示要请示管理层","说这是最低价了，不接受就算了","主动降价10%"],1,"这是本章教的反制顺序：让对方先表态，再请示上级。"]},

{n:6,zh:"谢谢您的报价，不过您得再给个更好的价。（说完就停，等对方回复）",t:"钳子策略",
c:"对任何报价或还价说一句「你得再给个更好的价」，然后闭嘴。",
w:"没经验的人听到这句话，常常会直接让出一大块空间。说完之后保持沉默（销售里叫「沉默成交」），先开口的人往往会先让步。",
h:["说完就闭嘴，等对方先开口。","对方对你用这招时，反问「具体要好多少？」，逼他说出具体数字。","谈判时盯住金额，而不是百分比：不管单子多大，让出去2000就是2000。","谈下来的每一块钱都是净利润。按5%的利润率算，让价2000相当于少做了4万的生意。","知道自己的时间值多少钱：别花半小时去谈10块钱，但真正在谈判桌上时，你每分钟可能在赚几十上百块。"],
e:"一位客户收到三份设备安装报价，准备选最低的那家时，想起这一招，在标书上写了一句「你们得再给个更好的价」寄回去，对方回来的报价又少了14000美元。作者还讲过两个销售员互相用沉默成交，僵持很久，最后一个人在纸上故意写了个错别字，另一个忍不住指出来，开口后就停不下来，自己把价格让了。",
r:"反问：Exactly how much better do I need to do? 把对方钉在一个具体数字上。",
s:"工厂报给你的采购价比上一单高，或者买家给了你一个还价。",
p:"Thanks for the offer, but you will have to do better than that.（然后不再补充，等待回复）",
k:["你得再给个更好的价 ＋ 闭嘴","被用时：具体要好多少？","谈金额不谈百分比","谈下的钱是净利润"],
q:["利润率10%时，你在谈判中多让了US$500，相当于少做了多少营业额？",["US$500","US$1,000","US$5,000","US$50,000"],2,"500÷10%＝5000。谈判桌上的让步直接从净利润里扣。"]},

{n:7,zh:"这个价格已经接近我们能做的了。我需要先和生产经理确认一下成本，24小时内回复您。",t:"请示上级",
c:"永远不要让对方知道你有最终决定权；也要设法去掉对方的「上级」借口。",
w:"如果对方知道你能拍板，他只需说服你一个人。你有上级时，他就得给出一个你能带回去「说服上级」的方案，并且要努力把你争取到他这边。上级还让你不必当面对抗：你可以说「拿这个价去委员会是浪费时间」。",
h:["上级最好是模糊的群体，比如定价委员会、工厂、合伙人，而不是一个具体的人，否则对方会说「那让你经理来」。","即使你是老板，也可以把负责该领域的下属当作上级：「我得先问问我们的生产部」。","对方的上级可以被用来：无对抗施压、拖延、配合钳子策略、引发竞价、配合白脸黑脸。","反制第一步，开谈之前就问：「如果方案能满足你所有需求，今天有什么理由不能做决定吗？」","如果去不掉，用三步：①恭维他的自尊「他们一般都听你的吧？」；②让他承诺「你会向他们推荐的，对吧？」（此时常露出其实没有上级）；③附条件成交：「先签，条件是你们的法务在24小时内可以基于法律原因否决」。","对方想去掉你的上级时：「看情况，超过某个数我就要报委员会。」","对方逼你马上决定：「现在就要答复的话只能是不行；明天和团队核完，也许可以。」","遇到层层加码的上级：每到新一层都退回你最初的立场，也搬出你自己的层级，别被一刀一刀切掉利润。","墨迹没干之前，不要把交易当成已经完成。"],
e:"作者当地产公司总裁时，总说要报董事会，第二天再说「董事会太难搞了，除非再便宜几百」，其实根本不需要董事会批准。他还创立了一家「物业管理公司」，对租客说自己只是替一群投资人管理，从此不再被当成有钱房东不停索要。他当年面试被拒时问店长「你会推荐我的，对吧？」，店长犹豫后说「好吧我愿意试试你」，暴露了根本没有总部委员会。",
x:"凭空编造一个不存在的董事会是在说谎。外贸里你真实需要请示的人（老板、工厂、合伙人）用起来更安全，也不会穿帮。",
r:"反对意见是购买信号，冷漠才是真正的问题：对价格挑剔的人才是认真的买家。",
s:"买家要求你当场确认一个很低的价格。",
p:"This is close to something we can work with. I need to confirm the cost side with our production manager first, and I will come back to you within 24 hours.",
k:["别承认你能拍板","上级要模糊、是群体","开谈前：满足所有需求，今天能定吗？","三步：恭维自尊 → 承诺推荐 → 附条件成交","被逼决定：现在要答复就是不","墨迹未干不算成交"],
q:["对方说「我得把方案交给采购委员会」，第二步应该怎么说？",["那我直接去见委员会","你会向他们推荐这个方案的，对吧？","那我先降5%","算了，不谈了"],1,"让对方承诺积极推荐。他要么答应，要么说出反对理由，两种都对你有利。"]},

{n:8,zh:"很高兴我们帮您赶上了提前出货。这次我们团队格外努力，那我们能不能约定：下一单改为30%定金，而不是出货后付50%？",t:"服务价值递减",
c:"你给对方的任何让步或帮助，价值都会迅速下降，所以要当场换回点什么。",
w:"实物可能升值，但服务做完之后，在对方眼里的价值会很快缩水。你帮了大忙，以为对方欠你人情，过个周末他谈判时照样寸步不让。",
h:["让步时立刻要求对方回报，不要指望他以后会补偿。","服务费、佣金要在做事之前谈好，不要事后再谈。"],
e:"地产经纪人谈佣金时6%听起来不多，房子卖出后卖家就会觉得「凭什么拿这么多」。一个客户因原供应商断货，你通宵调货保住他的生产线，他当场说爱死你了，下周一谈价时却和以前一样强硬。作者家修水管，师傅五分钟收150美元，作者抱怨，师傅说「我当知名演讲者的时候也赚不了这么多」。",
r:"",
s:"客户急需你帮忙把交期提前两周，你连夜协调工厂做到了。",
p:"Glad we could make the earlier shipment happen for you. Since our team went the extra mile on this one, could we agree that the next order goes on 30% deposit instead of 50% after shipment?",
k:["服务做完就贬值","让步后马上要回报","先谈价，再做事"],
q:["你帮客户紧急赶货成功，什么时候提出回报最合适？",["等下次谈判时再提","当场、马上","年底总结时","永远不要提，靠人情"],1,"服务的价值下降得很快，越早提，筹码越大。"]},

{n:9,zh:"我们双方都花了很多时间，现在只差15美分，因为这点差距谈崩就太可惜了。（等对方提出折中后再确认：那您是说可以出到4.025美元？）",t:"永远不要主动提出折中",
c:"不要自己提议「各让一半」，而要引导对方提出来。",
w:"折中不一定公平，要看双方开价是否合理。而且折中可以折不止一次（第二次就是75/25）。最关键的是：如果是对方提出折中，你再「勉强同意」，对方会觉得是他的方案、他赢了。",
h:["强调双方已经投入了很多时间，差距又这么小，放弃太可惜。","对方说「那就各让一半吧」时，装糊涂确认：「你是说你可以出到82000？」这样区间就变成82000到84000，而你一分没让。","然后请示上级：「我得跟合伙人商量」。第二天回复：「他们坚持84000，不过我们只差2000了……」，对方可能再折中一次。","就算最后停在82000，也是对方提出的方案，他会觉得自己赢了。"],
e:"作者和银行谈一笔32000美元的还款，他出28000，银行提出折中到30000，几周内又先后让到29000、28500，最后同意28250。",
r:"",
s:"你报US$4.20，买家还到US$3.80，谈了几轮后你在4.10，他在3.95。",
p:"We have both put a lot of time into this, and we are only 15 cents apart. It would be a shame to let it fall apart over that.（等对方提出折中，再确认：So you could come up to US$4.025?）",
k:["折中不等于公平","折中可以不止一次","让对方提出折中，你勉强接受"],
q:["双方只差一点时，最好的做法是？",["主动提议各让一半","强调差距很小、投入很多，引导对方提出折中","马上让到对方的价格","坚持原价不动"],1,"引导对方提议折中，你就能把区间缩小到对你有利的一侧，还让对方觉得是他提出的。"]},

{n:10,zh:"我理解付款条件对您很重要。我们能不能先把它放一放，先确认规格、包装和交货计划？",t:"应对僵局（单一问题卡住）",
c:"先把卡住的问题放一边，谈其他问题，用小共识积累势头。",
w:"新手常把单一问题上的分歧误认为谈崩了。真正谈不下去的情况很少。先解决小问题会建立势头，对方达成小共识后会变得更灵活。",
h:["分清三种情况：单一问题卡住（僵局）、谈不下去但还在谈（困境）、彻底不想再谈（死胡同）。","用暂置策略：「我理解这对你很重要，我们先把它放一放，谈谈其他问题好吗？」","先谈规格、包装、付款方式等小问题。","但不要把谈判缩到只剩一个议题，只剩一个议题时必然有输有赢（见第64章）。"],
e:"买家说「下个月一号前拿不出样品，就别谈了」；或者说「竞争对手给我90天账期，你不给就没什么好谈的」。这些听起来像谈崩了，其实只是僵局。",
r:"",
s:"买家坚持要90天账期，你们一贯只做T/T 30%定金。",
p:"I understand payment terms are important to you. Could we set that aside for a moment and first confirm the specifications, packaging and delivery schedule?",
k:["僵局≠死胡同","暂置策略：先放一边","先解决小问题建立势头","别缩到只剩一个议题"],
q:["买家在账期上寸步不让，本章建议你怎么做？",["立即同意","宣布谈判破裂","先把账期放一边，谈其他条件","找律师"],2,"用暂置策略，靠其他问题上的共识建立势头。"]},

{n:11,zh:"为了让第一单更容易下，我们可以分两批出货，或者接受您在90天内退回未拆封的整箱货，收取15%的退货处理费。",t:"应对困境（谈不动但还在谈）",
c:"改变谈判中的某个要素，重新找回势头。",
w:"就像帆船顶风停住，船长得调整帆、晃动舵来恢复动力。谈判卡住时，换掉一个变量就可能打开局面。",
h:["换谈判成员（「我下午有庭要上，换我的合伙人来」）。","换地点，比如一起去吃饭。","把惹恼对方的成员撤下，这本身也是一种让步。","聊点轻松的话题、讲个笑话缓解紧张。","调整财务条件：延长账期、降低定金、分期付款。对方可能不好意思主动提。","分担风险：比如一年后可以退回未用完的库存，收20%手续费；或加一条市场变化条款。","改变氛围：软的换成硬的，硬的换成软的。","修改规格、包装或交货方式。","约定以后有争议就仲裁，让对方放下担心。"],
e:"作者讲了一个笑话：工头让山两边的工人同时往里挖，碰上了就是一条隧道，碰不上就是两条隧道。改变动态之后，你不确定会发生什么，但总会有变化。",
r:"",
s:"新买家很想下单，但担心第一单卖不动、压库存。",
p:"To make the first order easier, we can split it into two shipments, or accept the return of unopened cartons within 90 days for a 15% restocking fee.",
k:["困境：都还想谈，但找不到路","改变一个要素：人、地点、财务、风险、规格、氛围"],
q:["以下哪项不属于本章打破困境的方法？",["换谈判成员","提出分担风险","调整付款条件","威胁起诉对方"],3,"本章的方法都是改变动态，而不是加剧冲突。"]},

{n:12,zh:"既然我们看法不同，您是否同意请一家独立的检验公司检查剩下的货？结果出来，我们双方都接受。",t:"应对死胡同（彻底谈崩）",
c:"真正的死胡同只能靠第三方解决：调解人或仲裁人。",
w:"第三方能解决问题，并不因为他比你更会谈。他被视为中立，双方更愿意听他的。请第三方不代表你失败。",
h:["调解人只能促成方案；仲裁人的决定双方事先同意服从。","第三方必须被双方看作中立。","如果是你的经理出面，他要先对客户做一个小让步，并且别用「我们」指你，甚至可以当着客户问你：「你坚持这个公平吗？能不能在账期上松一点？」","不要把死胡同当成不可想象：愿意接受谈崩，你才有离开谈判桌的力量。"],
e:"",
r:"",
s:"你和买家在一批货的质量问题上各执一词，谁也说服不了谁。",
p:"Since we see this differently, would you agree to have an independent inspection company check the remaining cartons? We will both accept their findings.",
k:["死胡同 → 第三方","调解促成，仲裁裁决","第三方要显得中立：先给对方小让步","愿意谈崩才有力量"],
q:["你的经理介入你和客户的争执，他应该先怎么做才能显得中立？",["坚定支持你","对客户做一个小让步","直接给出裁决","不说话"],1,"先向客户让一点，客户才会相信他不是来帮你的。"]},

{n:13,zh:"我不确定能不能提前这么多，我去和生产团队确认一下。如果我们能为您做到，您能为我们做什么？",t:"索取回报",
c:"对方要求任何让步，哪怕很小，你都问一句：「如果我们能做到，你能为我们做什么？」",
w:"三个好处：①你可能真的得到东西；②提高这个让步的价值，以后可以拿来交换；③最重要的是，阻止对方没完没了地要。如果对方知道每次提要求你都会要回报，他就不会一直磨你。",
h:["措辞要原样用：「如果我们能为你做到，你能为我们做什么？」","不要改成「如果我们做了，你就必须……」，那会在对方有求于你的敏感时刻制造对抗。","不要指定具体要什么，让对方自己提，往往拿得更多。","对方说「什么都不给」也没损失；必要时再退到具体条件：「除非你们能接受加急费，否则我很难说服我们的人」。","即使你本来就很乐意让步，也要这样问。"],
e:"作者的录像制作人接到电视台电话，想借用他签约的摄影师。以前他会说没问题，这次问了一句「我帮你，你能为我做什么？」，对方主动提出下次他用摄影棚超时免收超时费，省了几千美元。",
r:"",
s:"客户要求把交期从30天提前到20天，其实你的货已经备好了。",
p:"I am not sure we can bring it forward that much. I will check with our production team. If we can make it happen for you, what can you do for us?",
k:["每次让步都要回报","可能得到东西、抬高让步价值、阻止对方继续磨","别改成「你必须」","别指定具体要什么"],
q:["为什么「索取回报」最关键的作用是阻止对方不断蚕食？",["因为对方会觉得你很贪心","因为对方知道每提一个要求你都会要回报，就不会一直要","因为这样可以拖延时间","因为对方会马上让价"],1,"交换机制一旦建立，对方就失去了无限索要的动力。"]},

{n:14,zh:"感谢您在内部支持我们。我们的管理层在价格上同样严格。与其来回拉锯，不如看看还有什么可以调整，比如订货量或包装，让数字对双方都合适？",t:"白脸黑脸",
c:"一个人扮强硬，一个人扮好人，在不对抗的情况下给你施压。",
w:"黑脸制造压力，白脸假装站在你这边，让你不知不觉请他帮你争取，而他其实是对方的人。从小决定开始逐步升级（「蓝色还是灰色？」）也是白脸常用的方法。",
h:["只要对方有两个人以上，就要警惕这一招。","找你帮忙的房产经纪人其实替卖家工作，问他「卖家会接受多少」就是中了白脸黑脸。","最有效的反制：笑着点破，「你们不是在跟我玩白脸黑脸吧？坐下来好好谈。」对方会尴尬，然后收手。","也可以：自己也设一个黑脸（不在场的上级比在场的更难说服）；越级找对方老板（有风险，慎用）；让黑脸尽情发挥，他的同事迟早会烦；把白脸也当黑脸，「他说的话我也算在你头上」；对方带律师来扮黑脸，先说「我们别走对抗路线，一起找双赢方案好吗？」。","即使对方知道你在用这招，它依然有效。"],
e:"作者公司有家分店房租太高，房东不肯降。他在下午5点50分打电话说：「我完全同意你的立场，但半小时后董事会要问你是否同意降到1400，否则他们会让我关店。」房东说要起诉，他说：「我完全站在你这边，但董事会会说让他告吧，等两年才排得上开庭。」房东反而请他去董事会帮忙说情，主动降到1500。",
r:"",
s:"买家采购说：「我个人很喜欢你们的产品，但我老板只看价格，你再降一点我才好帮你说话。」",
p:"I appreciate you supporting us internally. Our management is equally strict on pricing. Rather than going back and forth, could we look at what else we can adjust, such as order quantity or packaging, to make the numbers work for both sides?",
k:["两人以上就要警惕","白脸不在你这边","笑着点破最有效","可以设自己的黑脸，不在场的更强"],
q:["对付白脸黑脸最有效的方法是？",["跟黑脸吵一架","请白脸帮你说情","笑着点破这一招","直接降价"],2,"这一招太出名了，被点破后对方通常会尴尬收手。"]},

{n:15,zh:"这一单您已经谈到了很好的价格。定制logo印刷是每件0.08美元，我们在报价单上已经列出了。如果您需要，很乐意帮您加上。",t:"蚕食",
c:"在双方达成主要共识之后，再要一点额外的东西；同时防止对方这样对你。",
w:"人在做出决定之前紧张、抗拒；做出决定后，大脑会强化这个决定（赛马场的研究：下注后的人更有信心，甚至想加注）。所以刚成交时，对方最容易答应额外的小要求。",
h:["不必一开始就把所有要求都提出来，等到达成共识的时刻再「再咬一口」。","第二次努力：之前被拒绝的升级方案，在成交后再提一次，「我们能再看一下顶配款吗？」","你也是：成交后心情最放松时最容易被蚕食。比如对方签字前问「这包括油箱加满吧？」「你们能给60天账期吧？别家都给」。","防守：书面列出所有附加项目的价格（账期、培训、安装、延保等）；不显示你有权让步。","被蚕食时，笑着让对方觉得有点小气：「你已经谈到很好的价格了，就别再让我们等货款了，好吗？」","防事后蚕食（拖款、擅自扣折扣、拒付安装费、砍量还要整柜价）：所有细节前期谈清并写进书面，不要留「以后再说」。","让对方觉得赢了，他就不太会蚕食。"],
e:"作者女儿高中毕业想要三样礼物：欧洲五周游、1200美元零用钱、一套新行李箱。她先谈下旅行，几周后拿出书面建议谈下零用钱，出发前再说「你不会让我拿着破箱子去欧洲吧？」。如果她一开始全提，零用钱会被压低，行李箱会被砍掉。",
r:"对方蚕食你时：笑着说「你已经拿到了很好的价格，别再……」。",
s:"客户确认下单后，又说：「你们能免费把我们的logo印在包装上吧？」",
p:"You negotiated a great price on this order already. Custom logo printing is US$0.08/pc and we have listed it on the quotation. Happy to add it if you would like.",
k:["成交后人最容易答应","第二次努力","书面列出附加项价格","笑着让对方觉得小气","细节前期写清，防事后蚕食"],
q:["防止被蚕食的最好方法之一是？",["成交后不接对方电话","在报价里书面列出所有附加服务的价格","一开始就给最低价","答应对方所有要求"],1,"附加项目价格提前写明，对方就很难在最后一刻要求免费。"]},

{n:16,t:"让步幅度递减",
c:"让步的方式会给对方传递信号：先做一个合理的让步，之后每次越来越小。",
w:"让步的模式会在对方心里形成预期。每次越让越小，等于无声地告诉对方：已经差不多到底了。",
h:["不要等额让步（每次250），对方会觉得推一下就有250，会一直推。","最后一步不要大：让了600再让400，然后说到底了，对方会想「再要100总可以吧」，你拒绝时他会很生气。","不要一次全让：对方说「三家都报个最低价，我们好选」，或者「我们公司从不讨价还价，直接报最低价」，这些本身就是谈判，后面可能还有一轮。","不要从小让步试探，然后越让越大。","正确示范：400、300、200、100。"],
e:"孩子要100美元，你说只给50；之后50、60、65、67.5，到67.5时你不用说「没有了」，他自己就知道了。",
r:"",
s:"你报价US$1.80，最低能到US$1.70。",
p:"第一次让到1.75，第二次1.72，第三次1.71，最后1.705。每次都配上理由，比如数量、付款方式。",
k:["别等额让步","最后一步别大","别一次全让，警惕「报最低价」「我们不谈价」","别从小到大","先合理，后递减"],
q:["以下哪组让步顺序最好？",["250、250、250、250","100、200、300、400","400、300、200、100","一次性让1000"],2,"递减的让步告诉对方你已经接近底线。"]},

{n:17,zh:"我已经尽力了，但我们的报价今天到期，而且这周树脂原料确实涨价了。采购部说现在最低只能1.73美元。如果今天能确认，我看看还能不能帮您保住1.72美元。",t:"收回条件",
c:"对付死磨价格的人时，收回上一步的让步或附加条件，逼对方做决定。",
w:"对方以为还能再挤一分钱，你一收回，他会立刻忘掉想要的新让步，转而急着抓住原来的价格。",
h:["只对死磨的人用，正常谈判的人不需要。","可以收回价格（1.72退到1.73），也可以收回附加项（运费、安装、培训、账期）。","用模糊的上级当坏人，你自己继续站在对方那边：「我尽力帮你争取」。","不要收回大的东西，会激怒对方。","这是赌博，会促成或搞砸交易。","对方对你用时：要求他们先解决内部问题，再继续谈。"],
e:"有人想卖度假屋份额，先说委员会大概要2万，对方嫌贵；第二天他说委员会决定不低于2.4万，再说「我去帮你争取回2万」，对方立刻按2万成交。",
x:"书里的版本是编一个「估价员算漏了原材料涨价」，这是说谎。外贸中只在真实变化时使用，比如汇率变动、原材料确实涨价、报价有效期已过。",
r:"对方突然收回条件：请他们先把内部问题解决好，再继续谈。",
s:"买家已谈到US$1.72，又要求1.71才下单；而你的报价有效期今天到期，原材料价格本周确实上涨了。",
p:"I tried my best, but our quotation expired today and resin prices went up this week. Our purchasing team says US$1.73 is now the lowest. Let me see if I can still hold US$1.72 for you if we confirm today.",
k:["只对死磨的人用","可收回价格或附加项","上级当坏人，你站在对方一边","别收回大东西","只在真实变化时用"],
q:["什么情况下适合用「收回条件」？",["对方第一次还价时","对方诚意谈判时","对方已接近成交还一直死磨最后一分钱时","每次谈判都用"],2,"这是赌博式的招数，只用来对付死磨的人。"]},

{n:18,zh:"单价我们真的动不了了，不过如果您今天确认，90天内的返单都按这个价格，并且这一单额外送1%的备品。",t:"欣然接受（给对方台阶）",
c:"对方好面子时，在最后一刻给一个很小的让步，让他体面地接受。",
w:"一些自认很会谈判的人，即使方案公平，也不愿觉得自己输了。阻碍成交的往往不是价格，而是自尊。让步的时机比大小重要，很小的让步也有效。",
h:["例子：亲自监督安装、价格保留90天方便返单、账期30天改45天、延保三年只收两年的钱、送一些配件。","这也是为什么不能一开始就亮出最好的条件：留一点到最后用。","绝不炫耀：别在谈完后说「其实你再坚持一下，我还能让更多」。","即使和熟人谈判，对方问「说说看，你的底线到底是多少」，也别说。","谈完后祝贺对方谈得好。"],
e:"律师在法庭上针锋相对，出庭后公诉人会称赞辩护律师表现出色，因为以后还会在别的法庭碰面。",
r:"",
s:"价格已经到底，但买家的采购经理在老板面前夸下海口要再压一点。",
p:"We really cannot move on the unit price, but if you confirm today, we will hold this price for any repeat order within 90 days and add 1% free spare parts.",
k:["阻碍成交的常是自尊","最后一刻的小让步","时机比大小重要","绝不炫耀，谈完要祝贺"],
q:["本章强调「欣然接受」中最重要的是什么？",["让步要大","让步的时机","让步要书面化","不让步"],1,"时机比大小重要，很小的让步也能给对方台阶。"]},

{n:19,zh:"交期是我们之间唯一的障碍吗？如果按原来的交期，就按原来的价格。如果要提前，可以空运，运费按实际成本收取。",t:"识破：诱饵",
c:"对方制造一个假的重点问题，再用它交换他真正想要的东西。",
w:"你拼命解决这个「难题」，找到办法时如释重负，就会在真正的问题上让步。",
h:["对方宣布某件事极其重要时，问问自己：这是不是诱饵？","孤立异议：「这是唯一让你担心的问题吗？」","然后请示上级并用白脸黑脸：「我们先写下来，我拿去和我们的人商量。」","反过来：「加急可以，但工程费会增加。」","对方突然表现得被冒犯，别慌，那也可能是招数。"],
e:"推土机厂的采购员说必须90天交货（正常要120天），离开15分钟后回来说：「我想到办法了，可以空运，但需要打点海关，你得免掉22000美元工程费并自付运费。」半年后卖方才从别人那听说，这家厂通常提前半年下单，90天根本不是问题。作者在酒店也用过：前台说只剩双人小床房，他说不接受，然后问「我将就的话，你们能为我做什么？」，房价打了对折，最后还换成了大床房。",
r:"保持专注，孤立异议，并把真正的问题和这个「诱饵」分开谈。",
s:"买家说：「必须在圣诞季前到港，否则不下单。」接着又说：「如果你们承担海运费，我们可以接受晚一周。」",
p:"Is the delivery date the only thing standing between us and the order? If the original date works, the original price stands. An earlier date is possible with air freight at cost.",
k:["假重点换真目标","问：这是唯一的问题吗？","把诱饵和真问题分开","被冒犯的表演也可能是招数"],
q:["买家坚持一个看似紧急的交期，随后要求你免运费作为解决方案。你首先应该？",["立即免运费","问清这是不是唯一的问题，并把交期和运费分开谈","取消订单","答应他所有要求"],1,"先孤立异议，防止对方用假问题换真利益。"]},

{n:20,zh:"这个认证我们这款产品做不了，而且它和价格是两回事。我们来看看您的市场实际需要哪些要求。",t:"识破：红鲱鱼",
c:"对方提出一个自己也不指望实现的要求，再在放弃它时向你索取让步。",
w:"和诱饵类似，区别是：红鲱鱼是一个假要求，撤回时要交换；诱饵是一个假问题，用来交换。名字来自英国：反猎狐者把咸鱼拖过狐狸的路线，让猎犬迷失方向。",
h:["对方抛出离谱要求后坚持很久，要警惕。","别让对方把撤回这个要求和你不想给的让步挂钩。","始终盯住真正的谈判议题。"],
e:"朝鲜战争停战谈判中，朝方提议让苏联当中立国，各方都反对。朝方反复追问「到底哪里不中立」，拖到最后才说愿意放弃，条件是允许他们修复机场。他们从没指望苏联能成为中立国，只是凭空造出一个筹码。",
r:"",
s:"买家提出一个你们明显做不到的认证要求，又说「如果做不到，那就把价格降8%」。",
p:"That certification is not something we can offer for this item, and it is separate from pricing. Let us look at the requirements you actually need for your market.",
k:["假要求，撤回时要交换","别把撤回和让步挂钩","盯住真正的议题"],
q:["红鲱鱼和诱饵的区别是？",["没有区别","红鲱鱼是假要求，撤回时索取让步；诱饵是假问题，用来交换","红鲱鱼更道德","诱饵只用于价格"],1,"两者都是凭空制造筹码，但形式不同。"]},

{n:21,zh:"我理解您在逐项比较报价。我们的包装用的是五层出口纸箱，因为较薄的纸箱曾在您所在的市场给其他买家造成破损。如果您更想要薄纸箱，我们可以报价，但不建议。",t:"识破：挑三拣四",
c:"买方拿到多家的分项报价，要求你每一项都对标最低的那家。",
w:"只要拿到分项明细，买方就能把每一项最低的拼成一个理想方案，逼最喜欢的那家去配合。条款也可以这样拼：全款的最低价加分期的最低利率。",
h:["作为买方：要求分项报价，然后请对方匹配各项最低。","作为卖方：尽量避免给出分项报价。","和买方建立私人关系，人们不太会对熟人用这招。","比买家更了解竞争对手：「您先比价没问题，不过我可以帮您省点时间：A公司用的是……，B公司的……」，让他觉得没必要再一家家去问。","计算对方的替代选择：如果他不能整体选你，就得自己去协调多个供应商，可能根本不划算。","谁的替代选择更多，谁就更有力量。"],
e:"三家装修报价，选中的那家被告知「地板贵了500，木工贵了200，跟另一家一样我就给你」，于是只好回去压他的分包商。",
r:"",
s:"买家拿三家报价单逐项对比：你的包装贵了，另一家的模具费低。",
p:"I understand you are comparing quotes line by line. Our packaging uses a 5-layer export carton because the lighter carton caused breakage for other buyers in your market. If you prefer the lighter option, we can quote it, but we do not recommend it.",
k:["买方要分项，卖方避分项","建立关系","比买家更懂竞争对手","算清对方的替代选择"],
q:["作为卖方，本章建议如何对付挑三拣四？",["给出最详细的分项报价","比买家更了解竞争对手，并建立私人关系","每项都降到最低","拒绝报价"],1,"了解竞争对手和建立关系，能让买家觉得没必要再逐家比。"]},

{n:22,zh:"我注意到这份报价没有包含模具费。能确认一下是免收了，还是需要发一份修改后的报价？",t:"识破：故意犯错",
c:"卖方故意漏算或少算一项，诱使想占便宜的买方匆忙签约。",
w:"买方以为抓到了对方的错误，急着在对方发现前成交，反而变成一个草率的谈判者。卖方还可以在签约前「发现」错误，用责备的眼神让买方补上。",
h:["反制只有一个：永远不要想占便宜。","直接指出：「我注意到这一项没算钱，是因为你想让我今天就做决定吗？」","变种：「错误结论成交」，销售故意说错，你一纠正就等于做了承诺。比如「您今天定的话，应该不需要今天提车吧？」「当然要今天提！」"],
e:"",
r:"别想占便宜，主动指出错误。",
s:"工厂给你的报价单漏了模具费。",
p:"I noticed the mould cost is not included in this quotation. Could you confirm whether it is waived, or send a revised quote?",
k:["故意漏项诱人上钩","别想占便宜，直接指出","警惕「错误结论成交」"],
q:["面对对方报价单上明显的漏项，最好的做法是？",["赶紧签约","直接指出并确认","假装没看见","要求再降价"],1,"贪小便宜会让你仓促决策，迟早要付代价。"]},

{n:23,zh:"谢谢您的付款。我们注意到有1%的扣款和银行手续费，这不在我们约定的条款里。请在下一笔付款时补上余款（金额xxx美元）。",t:"识破：默认",
c:"对方单方面做出对自己有利的假设，赌你懒得去纠正。",
w:"这招利用的是人忙、人懒。你一旦没反应，就形成先例，以后对方会说「你以前也没意见啊」。",
h:["例子：付款时自己扣掉2.5%的提前付款折扣，附言「其他供应商都给」；「十天内没收到您的回复，我们就发豪华款」。","识破后立刻、礼貌地指出，要求补齐，并表示希望以后更守规矩。"],
e:"",
r:"及时书面指出：「你们扣了2.5%，这不是我们约定的，请补齐余款。」",
s:"客户付尾款时自行扣掉了银行手续费和1%的「提前付款折扣」。",
p:"Thank you for the payment. We noticed a 1% deduction plus bank charges, which were not part of our agreed terms. Could you please remit the balance of US$xxx with the next payment?",
k:["单方面假设对自己有利","利用对方忙或懒","不纠正就成先例","礼貌而及时地指出"],
q:["客户付款时自行扣了折扣，你没吭声，最大的风险是？",["客户会生气","形成先例，以后会继续扣","银行会出错","没有风险"],1,"一旦默认，对方以后就能说你以前没意见。"]},

{n:24,zh:"我们管理层从不重新谈已确认的订单，他们宁可让我取消，也不会改价格。我能做的是这一批额外加2%的备品。",t:"识破：不断升级",
c:"双方已经达成协议后，对方又提高要求。",
w:"这招很恶劣，但常常奏效：对方知道你已经在情感上投入了，或者有发布会、交期等压力，不好意思放弃。",
h:["应对一：请示上级，「董事会从不重新谈已定的协议，会让我放弃这单」，再给台阶：价格不动，但在别的地方可以给点小东西。","应对二：反向升级，「你们愿意重新谈正好，我们也重新考虑了，价格也要调整」。","心里要知道：如果多付一点仍然是好交易，咽下去也是理性的，别让情绪做决定。","预防：前期把细节都谈清，不留「以后再说」；建立私人关系；收较大额的定金；让对方觉得赢，他就不想反悔。"],
e:"一位加盟商答应以高价把加盟区卖回总部，签约发布会前夜「听到一个声音说钱不够」，第二天要求多加50万美元，总部为了不取消发布会付了。书里也讲了守信的例子：有牧场主握手卖地后才得知迪士尼在秘密收购，可以多赚几百万，他依然守约。",
r:"",
s:"PI已经确认、定金也付了，买家又要求再降3%，否则就取消订单。",
p:"Our management does not reopen confirmed orders; they would ask me to cancel rather than change the price. What I can do is add an extra 2% spare parts on this shipment.",
k:["成交后加码","上级＋给台阶，或反向升级","预防：细节谈清、建立关系、收大额定金"],
q:["预防对方成交后加码，下面哪项最有效？",["不收定金","收取较大比例的定金","留些细节以后再谈","尽快发货"],1,"定金越大，对方反悔的成本越高。"]},

{n:25,zh:"谢谢您的来信。我们的价格对应的是我们讨论过的材料等级和测试。如果您愿意，我们可以把规格和您正在考虑的其他报价逐项对比。",t:"识破：故意泄露信息",
c:"人们更相信「偷偷看到」的信息，对方可能故意让你看到。",
w:"偶然得到的信息让人觉得更真实，哪怕只是一张没有证据的纸条。而且你没法事后说对方骗你，因为是你自己偷看的。",
h:["凡是只基于对方选择让你知道的信息来谈判，你都很脆弱。","信息看起来像是被你意外发现的，更要提高警惕。","交叉验证：问别人、查数据，不要只信对方给的。"],
e:"推销员向董事会汇报，看到一位董事传了张纸条，倒着读出来是「另一家报价76.2万，选他们吧」。董事长随即问「82万是你的最好价格吗？」，几分钟内他就降了5.8万。那张纸条真假无人知道。",
r:"",
s:"买家「不小心」转发了一封邮件，里面有另一家工厂更低的报价。",
p:"（自己回复时不提那封邮件）Thanks for your message. Our price reflects the material grade and testing we discussed. If you would like, we can review the specification side by side with any other offer you are considering.",
k:["偷看到的信息更容易被相信","只凭对方给的信息谈判很危险","交叉验证"],
q:["买家「不小心」让你看到竞争对手的低价，你应该？",["马上降到同样价格","警惕这可能是故意的，核实后再决定","质问对方为什么泄露","退出谈判"],1,"偶然看到的信息最容易让人放松警惕。"]},

{n:26,zh:"为了给您最好的价格，能否告诉我您预计的年采购量，以及您心里的目标价？",t:"让对方先表态",
c:"尽量让对方先报价、先提方案。",
w:"①对方的第一个报价可能比你预期的好；②你先得到信息；③你可以用夹住目标法。反过来，你先报价，对方就能夹住你。",
h:["对方开价太高时，不用报价也能压低他的期望：①装穷，「我肯定买不起，不过看你一直没用，也许你愿意便宜点卖」；②搬上级，「我太太要是知道我来问，肯定会杀了我」；③提竞争，「我在看另一条很划算的船，想先问问你的价」。","越不了解对方和标的，越要坚持不先报价。","除了价格，也最好让对方来找你，而不是你去找他。","如果双方都不肯先报价也不能一直僵着，但原则上先了解对方想要什么。"],
e:"披头士第一部电影，制片方准备给他们最多25%的利润分成，先报了2.5万美元片酬，问经纪人要多少分成。经纪人不懂电影业，又不肯装傻，直接说7.5%。片子大获成功，他们因此少赚了数百万。一位求职者被教导让面试官先开口，对方报了3.2万，他惊喜到愣住，面试官以为他不满意，又加到3.4万，而他原本只想要2.8万。",
r:"",
s:"新客户询价，没有透露数量和目标价。",
p:"To give you our best price, could you share your estimated annual quantity and the target price you have in mind?",
k:["让对方先报价","先报价的人被夹住","不报价也能压对方期望：装穷、上级、竞争"],
q:["为什么让对方先报价？",["显得礼貌","能获得信息，并能用夹住目标法","可以拖延","法律规定"],1,"先报价的一方会被对方夹住。"]},

{n:27,zh:"不好意思，您说的「到岸成本基础」具体是什么意思？我想确认自己正确理解了您的计算方式。",t:"装傻是聪明",
c:"谈判时表现得比对方知道的少，会让对方停止竞争，转而帮你。",
w:"大多数人愿意和比自己聪明的人竞争，但会帮助看起来不太懂的人。装傻能化解对方的好胜心。",
h:["装成「很懂行、能马上决定」的人，会让你失去这些选择：要时间考虑、请示上级、请专家审核、恳求让步、白脸黑脸、翻看笔记。","问对方用的词是什么意思。","请对方再解释一遍数字。","不要在你的专业领域装傻（心脏外科医生不能说「三根还是两根支架我也不确定」）。"],
e:"作者常说：「这个词我听过，不太确定意思，您能解释一下吗？」对方会想「遇到个笨手笨脚的」，然后开始帮他。",
r:"",
s:"英语不是你的母语，这在谈判里也可以变成优势。",
p:"Sorry, could you explain what you mean by 'landed cost basis'? I want to make sure I understand your calculation correctly.",
k:["装傻化解好胜心","保留要时间、请示、恳求等选项","问定义、请再解释","别在专业领域装傻"],
q:["哪种情况下不应该装傻？",["对方用了专业术语时","讨论数字时","在你自己的产品专业知识上","任何时候都可以"],2,"在专业上装傻会让你失去可信度。"]},

{n:28,zh:"谢谢今天富有成效的通话。我会把今天谈定的内容整理成形式发票（PI）和销售合同发给您审阅。",t:"别让对方起草合同",
c:"谈完后，要争取由你来起草书面协议。",
w:"口头谈判不可能覆盖所有细节。写合同的人会想到一堆没谈过的点，并按对自己有利的方式写进去，对方要改就得重新谈。即使是一句简短的还价条款，写的人也能加进好处。",
h:["谈判时详细记笔记，在会写进合同的条款旁打勾，写合同时更有底气。","团队谈判的话，让所有成员审一遍合同。","律师不一定是好的谈判者，可以先签意向书，再让律师完善成法律文件。","对方可能犹豫时，可加一句「以贵方律师批准为准」。","口头谈完尽快签备忘录，时间越久对方越容易忘记答应过什么。","确保对方真的理解协议，否则出问题时他只会怪你。","法律上，合同有歧义时，通常对起草方不利。","谈之前先写下你理想的协议，最后拿来对照，避免被意外让步冲昏头。"],
e:"同一个「卖方要求加5000美元」的还价：卖方经纪人写时，会加上「5000美元在接受时存入托管、24小时内有效」；买方经纪人写时，会写成「5000美元加到卖方回贷的票据里」。",
r:"",
s:"和美国客户谈好了价格、交期和付款方式。",
p:"Thank you for the productive call. I will send over the Proforma Invoice and sales contract summarising everything we agreed today, for your review.",
k:["起草方占优势","记笔记并打勾","尽快签备忘录","歧义对起草方不利","先写下你理想的协议"],
q:["为什么起草合同的一方有优势？",["他可以收费","他会把口头没谈到的点按对自己有利的方式写进去","法律偏向他","对方不会读"],1,"口头谈判总有遗漏，起草者负责补上这些空白。"]},

{n:29,t:"每次都要读合同",
c:"合同每次回到你手上，都要从头到尾读一遍，而不是只看你要求改的那一处。",
w:"电脑生成的合同改起来很方便，对方可能在改你要求的地方时，顺手改了别处。作者调查发现约20%的学员遇到过。",
h:["拿新旧两版对比文本。","用文档的修订模式记录所有改动。","比如「FOB工厂」被悄悄改成「FOB工地」，或者某个措辞微调，多年后出问题时才发现。"],
e:"",
r:"",
s:"客户发回修改后的PO，说「已按你的意见改了付款条款」。",
p:"逐条对比新旧版本的贸易术语、数量、单价、交期、付款方式、包装、质检和索赔条款，而不只是付款条款。",
k:["每次都完整读","新旧版本对比","用修订模式"],
q:["对方说「已经按你的意见改好了」，你应该？",["只看改动的那一条就签","通读全文并和旧版对比","让对方签了就行","不用看"],1,"对方可能同时改了别处。"]},

{n:30,t:"分解价格（不真实的钱）",
c:"把价格拆成每天、每件、每月，听起来会更便宜；自己要用总额思考。",
w:"不需要真的掏钱时，人更愿意花钱（赌场筹码、信用卡）。所以报价时可以把价格拆小，但别人这样对你时，要换回真实总额。",
h:["你可以用：「每件只多3分钱」「每天不到一杯咖啡」。","你要警惕：利率用百分比不用金额、强调月供、按砖按平方英尺算、按小时算的加薪、按月算的保费。","供应商说每件涨5分钱时，乘以你一年的采购量再看。"],
e:"一套1400美元的床单，店员说能用5年，每年280，每周5.38美元，「这么好的床单肯定不会一个人睡」，所以每人每天38美分。",
r:"把对方拆小的价格换回总额。",
s:"工厂说下一单每件只涨US$0.05。",
p:"US$0.05 × 每年20万件 ＝ US$10,000。按这个总额来决定花多少精力去谈。",
k:["拆小价格让人觉得便宜","自己用真实总额思考"],
q:["供应商说「每件只涨0.05」，你应该先做什么？",["直接接受","乘以年采购量看总额","要求每件涨0.03","换供应商"],1,"用真实的钱思考，才能判断值不值得认真谈。"]},

{n:31,t:"人们相信书面的东西",
c:"写成文字的东西比口头说的更让人相信，尽量书面呈现。",
w:"「特拉华州已关闭」的路牌让司机真的停下来问什么时候开放。酒店在门后贴一张退房时间的小纸条，按时退房率就大幅提高。",
h:["准备展示资料册：公司介绍、工艺、客户推荐信。","涨价时，给客户看上级的书面通知，比口头说「下个月要涨价」有力得多。","电话谈完，用邮件或文件书面确认。","大额报价用专业、详细的书面报价单。"],
e:"作者家火灾后请三家装修公司报价：两家手写，大约2.4万美元；第三家用电脑做出极其详细的报价，4.9万美元。他选了最贵的那家，因为不信任手写的。",
r:"",
s:"原材料涨价，你需要通知客户新价格。",
p:"附上一份正式的「Price Adjustment Notice」PDF：生效日期、原因、新旧价格对照，并说明在生效日前下单可按原价。",
k:["书面比口头可信","资料册、通知函、邮件确认","详细的书面报价"],
q:["涨价时，哪种方式最有说服力？",["电话口头通知","给客户看正式的书面涨价通知","不通知直接涨","在社交媒体发帖"],1,"人们相信写下来的东西。"]},

{n:32,t:"专注于问题本身",
c:"不要被对方的言行分心，只盯住让步在桌面上的移动。",
w:"网球选手不管对方怎么对裁判发火，只看球。谈判里的「球」是让步的移动，这是唯一影响结果的东西。",
h:["时常问自己：现在和一小时前、昨天、上周比，进展了多少？","职业谈判者可以离场，但那是有意的策略，而不是因为生气。","生气没关系，只要是可控的策略；失控就一定会输。","丢了单子时可以请经理打个电话，他没有情绪卷入，往往能救回来。"],
e:"作者让中介替他出价120万去谈一个要价180万的物业。中介回来说太丢脸了：对方说被冒犯，全体离场，只在门口丢下一句「低于150万不卖」。作者说：「你五分钟就让他们降了30万，还觉得谈砸了？」",
r:"",
s:"买家回邮件措辞很冲，说你们的报价是在侮辱他。",
p:"先看实质：他这次给出的价格和条件与上次比有什么变化？再回复具体问题，不针对情绪。",
k:["只盯让步的移动","生气只能是可控的策略","没情绪卷入的人更容易救回单子"],
q:["对方愤怒离场后，你最应该关注什么？",["对方的态度有多差","双方立场相比之前移动了多少","怎样报复对方","立刻道歉让步"],1,"情绪是噪音，让步的移动才是信号。"]},

{n:33,zh:"谢谢，和您一起把这件事谈下来很愉快。您真是很会砍价，这次谈判我学到了很多。",t:"一定要祝贺对方",
c:"不管你觉得对方谈得多差，谈完都要真诚地称赞他。",
w:"你想让对方觉得他赢了。从开价高于预期开始，一路的招数都是为了营造这种感觉，最后用祝贺收尾。",
h:["「您谈得真好，我没拿到理想价格，但从您这学了很多。」","有人说这是操纵，作者认为这是胜者对败者最高的礼貌。"],
e:"英军收复福克兰群岛大胜后，英国海军将领请投降的阿根廷将领上舰吃饭，称赞他打了一场漂亮的仗。",
r:"",
s:"一单艰难的价格谈判刚刚结束，客户确认了订单。",
p:"Thank you, it was a pleasure working this out with you. You drove a hard bargain, and I learned a lot from this negotiation.",
k:["谈完必祝贺","让对方觉得自己赢了"],
q:["谈判结束后为什么要祝贺对方？",["为了让他下次放松警惕","为了让他觉得自己赢了，愿意继续合作","这是法律要求","没有必要"],1,"这是优势谈判的收尾：让对方持久地觉得赢了。"]},

{n:34,zh:"与其让事情升级，您是否愿意请一个中立的第三方，比如我们的行业协会，帮我们找到双方都能接受的解决方案？",t:"调解的艺术",
c:"调解人没有裁决权，他的作用是帮助双方找到都能接受的妥协。",
w:"调解人可以分别劝双方让步；他没有利益，所以更会听、更有说服力；他提出方案时，不代表任何一方已经同意；他通常是该领域的专家，知道什么才算合理。",
h:["和打官司比，调解更便宜、更快、没有上诉、调解人更懂行、更能保住关系、全程保密。","调解人必须被视为中立；被认为偏向时，要先对另一方做个小让步。","流程一：电话会议，强调必须愿意妥协，并尽量去除双方的「上级」借口。","流程二：双方各写不超过四五页的立场说明（争议怎么来的、要解决什么、受了什么损失、希望怎样和解），同时抄送对方。","流程三：联合会议，各方开场陈述，宣泄本身就有疗愈作用。","流程四：第一次私下会谈，让各方给问题排序，探出己方论点的弱点。","流程五：第二次私下会谈，让各方保密地提出和解方案，然后进入谈判阶段。","流程六：签署和解协议，由双方律师起草，调解人不代写。"],
e:"并购谈判陷入僵局时，一位律师说下午要出庭，换他的合伙人来。合伙人一上来就对自己这边说：「我们坚持这一点公平吗？也许可以让一点。」对方觉得他讲理，很快找到了共同点。",
r:"",
s:"和老客户因质量索赔金额争执不下，但双方都想继续合作。",
p:"Rather than escalating this, would you be open to involving a neutral third party, such as our trade association, to help us find a settlement we can both accept?",
k:["调解是促成，不是裁决","更便宜、快、保密、保关系","调解人必须中立","流程：电话会→书面陈述→联合会议→私下会谈→和解协议"],
q:["调解和仲裁最大的区别是？",["调解更贵","调解人没有裁决权，仲裁人的决定双方须服从","仲裁需要法官","没有区别"],1,"调解靠双方自愿达成一致，仲裁一定有输有赢。"]},

{n:35,t:"仲裁的艺术",
c:"仲裁一定有输有赢，比诉讼快、便宜，但比调解对抗性更强。",
w:"双方事先同意服从仲裁员的裁决。仲裁员必须被双方视为中立，否则裁决可能被推翻。",
h:["选一位双方都信任、有该领域经验的专业仲裁员。","选不出来时，各选一名，再由两人共同选第三名；仲裁员人数应为奇数。","仲裁员要披露与当事人的任何过往联系，不能和一方单独接触。","预备会议：让双方宣泄，并探讨能否转为调解；确定索赔金额和反诉，约定证据交换的范围和时间。","听证会类似审判但没有陪审团；传闻证据可以被采纳，由仲裁员判断权重。","通常在最后一次听证后30天内书面裁决，可以不给理由。","有约束力的裁决可以交法院执行；无约束力的仲裁只是给出意见。","法院一般只会因舞弊或偏见推翻裁决。"],
e:"",
r:"",
s:"给海外客户的合同里，争议解决条款应该怎么写？",
p:"在合同中明确：适用法律、争议先友好协商、协商不成提交哪个仲裁机构、在哪里仲裁、用什么语言。签之前可请专业人士审核。",
k:["有输有赢","选双方信任的专家","奇数个仲裁员","预备会议可能转向调解","裁决可不附理由"],
q:["双方选不出共同信任的仲裁员时怎么办？",["交给法院","各选一名，两人再共同选第三名","抛硬币","放弃仲裁"],1,"这样能组成一个奇数的三人仲裁庭。"]},

{n:36,zh:"发生这种事我真的很抱歉，我理解这有多让人着急，尤其是在您的销售旺季之前。能告诉我具体有多少件受影响，以及怎样处理才能让您满意吗？我们希望继续合作。",t:"化解冲突的艺术",
c:"像人质谈判专家一样：控制局面、让对方发泄、找到伤害、量化诉求、转向共同利益。",
w:"阿提卡监狱暴动和慕尼黑奥运会人质事件的惨痛教训，让警方发明了新方法：冷静、人道、建立信任、用小让步换小让步。",
h:["五种应对：直接攻击；等待观察；只谈不让步；谈判但在让步上撒谎；谈判并愿意做小让步。专家用最后一种。","不要在大事上撒谎：短期得利，长期失去信任。","切断对方和外界的沟通，让主谈判员成为唯一渠道。","时间站在谈判员一边：错过的最后期限会削弱对方的可信度。","对方的离谱要求只是开场立场；最危险的是不说话的人。","小换小：你放一个人质，我们送一个三明治。","日常应用一：控制局面别让它恶化（比如先让愤怒的客户同意开个电话会）。","二：让对方发泄，承认他的感受是真实的，即使你不认同。","三：愤怒背后一定有受伤，找到他觉得受伤或受威胁的地方。","四：尽快让他说出要什么，把问题量化。","五：收集信息，关注人而不是问题本身。","六：把对方从立场拉回共同利益。","优势谈判者的信条：别想「我能让他给我什么」，要想「我能给他什么，对他有价值又不损害我的立场」。"],
e:"作者在百货公司工作时，一对老夫妇投诉买的炉子烧坏了墙和地毯，层层上报没人敢问赔偿。作者去了直接问：「你们觉得我们该怎么补偿？」老先生说墙自己能擦，只想要一块小地毯盖住破洞。",
r:"",
s:"客户收到货后发来愤怒邮件，说有一批破损，要求全额退款并取消后续订单。",
p:"I am really sorry this happened, and I understand how frustrating it is, especially before your sales season. Could you tell me exactly how many units are affected and what would make this right for you? We want to keep working together.",
k:["控制、宣泄、找伤害、量化、收集信息、转向共同利益","不在大事上撒谎","小让步换小让步","信条：我能给他什么"],
q:["面对愤怒的客户，作者建议尽快做什么？",["证明对方错了","让他说出具体要什么，把问题量化","立刻全额赔偿","不理他"],1,"把模糊的愤怒变成具体诉求，问题就解决了一半。"]},

{n:37,zh:"货物最晚什么时候必须到才能赶上展会？",t:"时间压力",
c:"80%的让步发生在最后20%的时间里；不要暴露你的截止期限，并尽量弄清对方的。",
w:"人在时间压力下会变得更灵活。有人会故意把小问题拖到最后再提，就是因为那时你更容易让步。",
h:["把所有细节都在前期谈清，听到「这个以后再说」时要警觉。","永远不要透露你的截止期限；如果对方知道你订了6点的航班，告诉他你还有9点的备选，或者需要多久都可以留。","尽量了解对方的截止期限。","双方面临同一个期限时（比如续租），选择更多、力量更强的一方可以用时间压力；弱的一方应该提前谈。","判断谁更强：在纸上画一条线，左边列出谈不成时你的选择，右边列对方的。","每个人都以为自己是弱的一方，因为只知道自己的压力，要在心里补偿这一点。","谈判越久，对方越灵活，像拖船一点点推动邮轮；但你也会越来越想成交。","忽略已经投入的时间和金钱，只问：「不考虑已投入的，现在这笔交易还值得做吗？」","接受时间：对方一开始无法接受的提案，放在桌上一段时间，他可能慢慢接受。"],
e:"越南和谈时，美国代表在巴黎按周租酒店，越南代表租了两年半的别墅，然后花了几周讨论桌子的形状，把美国逼到大选前的期限。一位地产经纪人签约时随口说「价格降得多的话佣金可以商量」，成交前一周卖家只肯给5000美元，而合同上写的是3.6万美元。",
r:"",
s:"美国客户说「必须赶上展会」，同时你自己月底也有业绩压力。",
p:"不要提你的业绩压力。可以问：When is the latest date the goods need to arrive for the trade show? 然后据此安排谈判节奏。",
k:["80/20：最后时间里让步最多","细节前期谈清","不暴露截止期限","选择多的一方才用时间压力","忽略沉没成本","给对方接受时间"],
q:["你和对方面临同一个截止期限，什么时候应该提早谈判？",["永远提早","当对方的替代选择比你多时","当你的替代选择比对方多时","永远拖到最后"],1,"力量弱的一方应该避开时间压力，提前谈。"]},

{n:38,zh:"能简单介绍一下您是怎么卖这款产品的吗？您现在从谁那里采购？和现在的供应商相比，您最想改进的是什么？",t:"信息就是力量",
c:"谈判前和谈判中尽可能多地收集对方的信息：承认自己不知道，敢问，问开放式问题，问对的人。",
w:"情报多的一方胜算大。很多人花钱学滑雪、潜水，却在涉及大笔钱的谈判前不做功课。",
h:["规则一：敢承认不知道。区间测验里多数人答错，是因为不肯把区间放大到「我不知道」。","规则二：敢问问题。即使对方不回答，他的反应也是信息。","规则三：问开放式问题，少用「为什么」（像指责），改成「你一定有你的理由，是什么呢？」。","四个技巧：重复问题（「你觉得我们太贵？」）；问感受（「你对这个政策感觉怎样？」）；问反应（「你对此怎么看？」）；请对方换个说法（「我不太明白你为什么这么说」）。","规则四：换个地方问，离开对方的办公室（喝咖啡、吃饭），信息流动更自由。","规则五：问对方以外的人：他的老客户、更低层级的员工（假设你说的话都会传回去）、同行对同行（工程师对工程师，财务对会计）。可以交换信息，但不要泄露不想让对方知道的。","规则六：提问还有其他目的：批评、引发思考、教育对方、表明立场、获得承诺、拉近双方。","处理投诉时，先把所有问题列在纸上、画线封底，再逐项谈，避免对方不断加码。"],
e:"一对老夫妇只想要一块地毯就满意了，前面所有人都没敢问。喜剧演员斯拉皮·怀特说：「我从没遇到过糟糕的观众，只遇到过我了解不够的观众。」",
r:"",
s:"一个新询盘，你几乎不了解对方。",
p:"Could you tell me a bit about how you sell this product? Who are you currently buying from, and what would you most like to improve compared to your current supplier?",
k:["承认不知道","敢问，反应也是信息","开放式问题与四个技巧","换地点、问别人","提问的其他目的"],
q:["以下哪个问题是开放式问题？",["你们一年采购多少？","你们需要30天交货吗？","能说说你们现在的供应商有哪些让你不满意的地方吗？","你是负责人吗？"],2,"开放式问题不能用一个词回答，能带出更多信息。"]},

{n:39,zh:"我真的很想和您合作，但在这个价格下我们没法保持质量标准。如果一定要按X美元，我们暂时只能先退出了。",t:"随时准备离开",
c:"让对方相信，谈不拢你随时会走，这是最强的施压点。",
w:"一旦你心里想着「我一定要拿下」，你就输了：对方会感觉到你没有别的选择。",
h:["没有什么是非买不可、非卖不可、非得这份工作不可的。","卖方要先建立对方的欲望再用这招，否则对方会让你直接走。","销售四步：寻找客户、确认资格、建立欲望、成交；离开是第四步的招数。","目的是让对方因为相信你会走而让步，不是真的走掉。","大事上别一个人用，留一个白脸在桌边：「他只是有点激动，你们价格上再灵活一点，还能谈。」","离开的力量来自更多选择：看中一套房，就再找两套同样喜欢的。","展示时要微妙，比如「我也许可以代理你」。"],
e:"作者女儿看中一辆二手车，问她「今晚没买到车回家能接受吗？」，她说不能。作者说那还不如直接按标价付钱。两人在店里谈了两小时，中途走出去两次，最后便宜了2000美元。一位经纪人对作者说「我也许可以代理你，你什么时候来我办公室？」，又说只接9个月的委托；作者犹豫，他起身握手说那就不合作了，最后谈成6个月，大概正是他本来想要的。",
r:"",
s:"一个大买家压价压得你几乎没有利润，你很想要这个客户。",
p:"先给自己准备好其他客户。然后：I would really like to work with you, but at this price we cannot keep our quality standards. If it has to be US$x, we will have to step back for now.",
k:["想着非成交不可就输了","先建立欲望再用","目的是让步，不是真走","留一个白脸","靠更多选择建立离开的力量"],
q:["怎样才能真正拥有「离开的力量」？",["在谈判中发脾气","提前准备好其他选择","说狠话","压低报价"],1,"选择越多，你越不怕谈不成。"]},

{n:40,zh:"我理解。怎样才能让您就这一次破个例？比如，如果我们一次下两个月的量呢？",t:"要么接受，要么走人",
c:"不要说「要么接受要么走人」这句话；对方这么说时，有三种应对。",
w:"这句话太生硬，会让本来愿意接受的人也想反抗。通用电气的劳资谈判负责人坚持只出一次价、绝不改动，最终导致多个工会联合罢工。",
h:["换成柔和的说法：「抱歉，这是我们的底价」「我们从不偏离公开价目表」，或者用上级：「我很想帮你，但总部不让」。","一位纽约酒店老板用「岳母价」：「我岳母来住也是这个价，没人比这更低。」","对方说时，应对一：叫牌，表示上级要求必须有让步，否则没法合作。但先想想对方会不会因你离开而受损（没有提成的店员根本不在乎）。","应对二：委婉越级，「谁有权破例？」「能请你问问主管能否破一次例吗？如果有人能说服她，那一定是你。」","应对三（最好）：给对方台阶，「如果我愿意付加急费，你可以破一次例吧？」「怎样才能让你在这件事上稍微调整一点，就这一次？」"],
e:"作者凌晨4点到东柏林的酒店，想少付第一晚的钱，前台寸步不让，说「西柏林也许这么做，我们这不行」。他意识到对方没有让他满意的激励，就放弃了。",
r:"",
s:"供应商说：「这就是我们的价格，不谈。」",
p:"I understand. What would it take for you to make an exception just this once? For example, if we placed the order for two months together?",
k:["别说要么接受要么走人","用底价、价目表、上级、岳母价","应对：叫牌（先看对方会不会受损）、委婉越级、给台阶"],
q:["对方说「这就是我们的价格，不谈」，最理想的应对是？",["马上走人","帮对方找一个保住面子的方式破例","答应","威胁投诉"],1,"给台阶最不伤关系，尤其当对方能从中获益时。"]},

{n:41,zh:"我们注意到第5条和第8条有几处我们没讨论过的修改。我们对这些条款的立场请看附件里的版本。",t:"既成事实",
c:"先斩后奏，赌对方懒得重新谈判。",
w:"原理是「求原谅比求许可容易」。比如寄一张少付的支票，背面写「已全额付清」；汽修店不经同意就修好车再扣车要钱（加州为此立法禁止）。",
h:["这招会严重伤关系，只在你不在乎对方反应时用。","温和版：签合同时把你不同意的地方直接改好寄回，对方可能懒得再谈。","被多收费时，直接按正确金额付款，可能比争论简单。"],
e:"一位广告牌老板的广告牌被农场主的树挡住，对方要天价才肯修剪。他派工人一早翻进去同时开锯，几分钟就锯完了，事后再去道歉，反而谈成了合理补偿。两位电影制片人在合约期内签约了另一家公司，再告诉原老板，对方大怒，最后花了5亿多美元才解约。",
r:"",
s:"客户把你的合同改了几处后直接签字回传。",
p:"逐条检查改动（见第29章）。不能接受的地方，礼貌地书面指出并附上修订版：We noted a few changes to clauses 5 and 8 that we had not discussed. Please see the attached version for our position on these.",
k:["先做再说","伤关系","温和版：直接寄回修改后的合同"],
q:["使用「既成事实」最大的代价是什么？",["花钱","可能激怒对方、伤害关系","违法","效果不好"],1,"这招不会让对方喜欢你。"]},

{n:42,zh:"我理解预算很紧。您的新预算期什么时候开始？如果有帮助，我们可以现在生产，把出货和开票安排在新的预算期。",t:"烫手山芋",
c:"对方想把他的问题变成你的问题：没预算、没权限、明天必须到。要立刻验证它是不是真的。",
w:"如果你开始替对方解决问题，他很快会认为这真的是你的问题，到那时再去验证就晚了。",
h:["马上测试真伪：「如果有一套完全合适的房子，但首付要1.5万，还值得看吗？」十有八九对方会说可以想办法。","「我们只有每平米20块的预算」，回答：「如果有一款耐用两倍、只贵10%的地毯，您愿意看看吗？」","「没预算」时问：「谁有权批准超预算？」","或者问：「你们的预算年度什么时候结束？」","不要替对方的流程问题买单：预算可以改，流程也可以改。","被丢烫手山芋时，作者最想做的是降价；正确做法是先验证。"],
e:"作者想让一家公司给80名销售员每人买一套他的CD，培训主管说没预算。他差点想降价，后来改问「你们的预算年度什么时候结束？」——9月底。于是他说10月1日发货开票，30秒就成交了6300美元。在一家酒店，他想延迟退房，前台说要加收半天房费，他问「谁有权免掉？」，前台指了指旁边的同事，同事当场同意了。",
r:"",
s:"买家说：「我们今年的采购预算只有这么多，价格必须再降。」",
p:"I understand budgets are tight. When does your budget year start again? We could produce now and schedule shipment and invoicing for the new period, if that helps.",
k:["别接对方的烫手山芋","立刻验证是不是交易杀手","谁有权超预算？预算年度何时结束？","流程问题是对方的"],
q:["对方说「没预算」，作者用了什么问题成交？",["你们最多能出多少？","你们的预算年度什么时候结束？","我降价你买吗？","你老板是谁？"],1,"把付款时间挪到新的预算期，问题就解决了。"]},

{n:43,zh:"我们很重视这笔生意，正在处理。周五之前，能否告诉我：如果做部分调整，比如在包装成本上，能不能解决您那边的问题？",t:"最后通牒",
c:"只在你真的愿意执行时才发出最后通牒；对方给你最后通牒时，先测试它。",
w:"发出最后通牒后如果没执行，你就失去了全部力量。所以对方最简单的反制就是等着期限过去。",
h:["不要说「只有今天这个价」，除非你真的会做到。","应对一：尽快测试，「中午前到一部分货能解决问题吗？其余的海运？」","应对二：不接受，「我不确定能不能赶上，但保证会尽一切努力」。","应对三：拖时间，时间越久，对方越不可能执行。","应对四：虚张声势，让期限过去。这需要勇气，事先要查清有没有变化：是否出现了新的供应商或更好的报价？对方是想继续合作，还是想用最后通牒把你踢出局？"],
e:"",
r:"",
s:"买家来信：「周五前不降5%，我们就把订单给别家。」",
p:"We value this business and are working on it now. Before Friday, could you tell me whether a partial adjustment, for example on the packaging cost, would solve the issue on your side?",
k:["不愿执行就别发","测试、不接受、拖时间、让它过去","先查清有没有变化"],
q:["对方给你最后通牒，最强的反制是什么？",["立即让步","揭穿并让期限过去，看对方是否执行","威胁对方","道歉"],1,"不执行的最后通牒会让对方失去力量；但这样做之前要先查清情况。"]},

{n:44,t:"美国人怎么谈判",
c:"美国人重「交易」和合同，很多其他文化更重「关系」；美国人进入正题太快。",
w:"美国人口流动大，社区约束弱，所以把信任放在牢不可破的合同上，打官司也很平常。很多其他文化把合同看作某个时刻双方关系的表达，关系变了，合同也会变。",
h:["韩国：合同基于签约时的情况，情况变了，合同可能被视为失效。","中东：签合同意味着谈判的开始。","印度：法院积压严重，更依赖对人的信任。","中国：被起诉很丢面子，通常不会再和起诉自己的公司做生意。","高语境（重关系）到低语境（重合同）的顺序：亚洲、中东、俄罗斯、西班牙、意大利、法国、英国、美国、北欧、德国、瑞士。","语言也有高低语境：美式英语说什么就是什么；英国人说「quite good」可能有多种含义；中文没有单复数和时态，要听上下文。","请翻译时，要分清是逐字翻译，还是会传达你的意图的口译。","美国人的两大陷阱：重交易轻关系；太快谈正事。","建议顺序：先观察，再听，最后说。反应慢一点是尊重。"],
e:"作者公司接待从伊朗逃出的波斯富商时发现，他们要先喝几个小时茶，了解你这个人，太快谈生意会被怀疑。有人去日本谈判，被热情招待好几天，直到去机场的路上才开始谈，在时间压力下直接亮出了底线。",
r:"",
s:"作为中国卖家，你面对的是美国买家。",
p:"美国买家可能很快进入价格、很直接，这不是不礼貌。你可以简洁专业地回复，同时用几次真诚的沟通建立信任。",
k:["美国重交易，其他文化重关系","高低语境排序","美国人进入正题太快","先观察，再听，后说"],
q:["在中东文化里，签合同通常意味着什么？",["谈判结束","谈判开始","双方变成朋友","可以起诉对方"],1,"书中说中东商人常被称为「合同收集者」，签约后才开始真正谈。"]},

{n:45,zh:"很好！谢谢关心。",t:"和美国人做生意（写给非美国人）",
c:"了解美国商业文化，才不会误读他们的言行。",
w:"作者是英国移民，从外人的视角观察美国人。对你这个面向美国客户的卖家来说，这一章特别实用。",
h:["简洁：英国人说一大段，美国人说「Great day!」。","问你「感觉怎么样」时，一个词就够：「Great!」","满嘴习语，别按字面理解。","很爱国：不要批评美国（交通、治安等），夸奖要先于其他话。","阶层看钱，所以头衔很重要；喜欢讲自己白手起家的故事。","宗教虔诚，特别是中部「圣经带」各州，要尊重。","边疆精神：极其看重自由，讨厌被管。","时间就是金钱，喜欢快速成交；催你成交不是在骗你。","有话直说，「这是胡扯」不是人身攻击。","表面热情：「改天聚聚」不是真的邀请。","名片随手收起就行。","小费：餐厅、酒吧、出租车约15%，行李每件1美元。","人口多元，别凭外表或性别判断谁是老板。","崇尚个人成就，竞争心强，想赢而不是想妥协。"],
e:"",
r:"",
s:"美国客户问你：How was your trip to Las Vegas for the show?",
p:"Great! Thanks for asking. 然后直接进入正事，比如约好会面时间。",
k:["简洁、直接、爱国","头衔重要","时间就是金钱","表面友好别当真","多元、竞争"],
q:["美国客户说「We should get together sometime」，通常意味着？",["他在约你见面，要马上定时间","只是一句客气话","他要下订单","他想换供应商"],1,"作者初到美国时也误以为是正式邀请。"]},

{n:46,zh:"让我想一下。",t:"美国人的谈判特点",
c:"在别国人眼里，美国谈判者直接、心急、常常一个人来、怕沉默、不愿说「不知道」。",
w:"了解这些，美国人可以避免被误解；你作为对手，也知道怎么应对美国买家。",
h:["说话很直接，可能冒犯别人。","不愿开离谱的价，想快点成交。","常常一个人去谈，对方可能觉得他不认真或只是来收集信息。如果必须声明权限，就说只有权谈到某个价位，再往上要请示，并且不透露那个价位。","不习惯情绪表达；对方发怒时可能只是一种在他们文化里正常的招数。","看重短期利润。","很少会外语：学几句当地问候语、把资料翻译成当地语言，能体现长期合作的诚意。","出国少：只有约21%的美国人有护照。","怕沉默：沉默之后先开口的人，往往会让步。","不愿说「不知道」：你不需要回答每个问题，可以说「这个阶段属于保密信息」。"],
e:"一位抵押贷款银行家在上海谈判，20人围坐，对方突然全体沉默。他看了看表，33分钟无人说话，最后对方的律师先开口做了让步。",
r:"",
s:"美国买家在电话里抛出一个问题后，你需要时间想。",
p:"不要急着填满沉默。可以说：Let me think about that for a moment. 然后真的停一下。",
k:["直接、心急、单独谈判","怕沉默：先开口的人先让步","不必回答每个问题"],
q:["谈判中出现长时间沉默，按书中所说，谁通常会先让步？",["职位更高的人","先开口的人","人数多的一方","买方"],1,"所以不要怕沉默，把它当成挑战。"]},

{n:47,zh:"什么样的交货日期对您的团队比较合适？",t:"非美国人的谈判特点",
c:"不同国家有不同的商务习惯。这是倾向，不是定论，要观察具体的人。",
w:"刻板印象当然有偏差，但完全忽视国家特点也是错的。了解这些倾向，可以减少误会。",
h:["英国人：叫他们English，不要叫British；守时但别早到；非常礼貌，不问私人问题；用天气开启对话；对精明的美国人有戒心；节奏较慢。","法国人：巴黎压力大，其他地方很友善；穿得讲究一点；可能听得懂英语但不愿说；喜欢逻辑和辩论；说yes意味着maybe，说no意味着「我们谈谈」；决策集中在高层；守时；除非主人先提，吃饭时别谈生意。","德国人：低语境，合同详细，签了基本不改；守时；握手要有力；谈事时别把手插口袋，工作场合别开玩笑；正式，用Sie和头衔，未经邀请别直呼其名。","亚洲人：重关系胜过合同；承诺常被视为对个人而非公司做出的；签约是关系的开始；不直视对方是礼貌，不是心虚。","韩国人：合同是签约当天的理解，情况变了就可能不受约束。对策不是轻视合同，而是把合同写得能应对变化，为各种变化设定奖惩。","中国人：先看关系，再看道理，最后才看法律；保持低调，大声会冒犯人；可能以「你辜负了友谊」施压；团队决策；讲究人情往来；尊重职位和年龄；重面子，会上不会公开支持或反对；喜欢讨价还价，开价高、愿意让步，你也照做并享受过程。","日本人：「是」只表示听到了，要问开放式问题（「什么时候能做？」而不是「能做吗？」）；「这有点困难」意思是不行；场面话和真心话不同；重和谐与集体，等级分明；没有单一的主谈判人，反馈少；有人情往来的习惯；对陌生人开价高，是为了观察你；集体决策慢，但一旦决定，所有人都全力投入。","俄罗斯人：受过去体制影响，未必以利润为动力；敢提强硬的开价；希望你表达尊重；官僚思维，常说没有权限，「没授权的就是禁止的」；会反复说不来考验你；直接表达不满；「不方便」等于不可能；内心比表面更看重关系。","中东：别把埃及人、伊朗人称为阿拉伯人；需要几天建立关系；签约后才开始谈；楼层越高越有面子，别在一楼办公室谈；迟到很正常；对方热情款待送礼时，回礼可以化解人情负担。"],
e:"一位美国老板把公司卖给日本公司后，向一位比他年轻的日本主管汇报。主管从没拒绝过他的提议，他始终分不清对方是真喜欢，还是不好意思对年长者说不。",
r:"",
s:"一位日本客户说：「这个交期，可能有点困难……」",
p:"把它当成「不行」来处理，并用开放式问题追问：What delivery date would work well for your team?",
k:["英：礼貌、不问隐私","法：yes＝maybe","德：合同细、守时、头衔","韩：合同随情况变","中：关系、面子、人情","日：困难＝不行","俄：不方便＝不可能","中东：签约才开始谈"],
q:["日本客户说「这有点困难」，通常意味着？",["可以，但要加钱","不行","需要再考虑一天","非常愿意"],1,"日本人不愿直接说不，「困难」就是委婉的拒绝。"]},

{n:48,zh:"和您现在用的相比，您觉得这个表面处理怎么样？",t:"肢体语言：读懂人",
c:"谈判中多达80%的反应是非语言的；重要的是肢体语言的变化，不是单个动作。",
w:"人们更相信看到的，而不是听到的。面对面能看到电话里看不到的大量信息，还能握手成交。",
h:["判断要不要当面去谈：如果你在犹豫，那就去。","只解读变化：一个人习惯摸鼻子不代表说谎；被问到某个问题时突然摸鼻子，才值得注意。","握手：坚定但别太用力；手心出汗代表紧张。","座位：一个人对两个人时，别坐在他们中间；人少的一方要分散坐，显得是两个声音。","什么时候谈正事：等对方解开西装扣子，肩膀放松、手自然、语气平稳、眨眼不快、双手分开、略带微笑。","眨眼频率突然变快：紧张或可能在说谎。","头微微倾斜：在认真听；头完全正直：可能没在听。","手到头部：拇指食指摸下巴表示感兴趣；下巴托在掌根上表示无聊；摸鼻侧可能在夸大或说谎；拉耳朵表示想听更多；挠头表示尴尬，可以换个方向。","手部：敲桌子表示不耐烦；指尖对指尖（尖塔手势）表示非常自信；男性手放胸口表示真诚；捏鼻梁表示专注；摸后颈表示恼火。","眼镜：从镜框上方看你表示不信或不赞同；反复擦眼镜表示需要时间考虑，这时你可以停一下；咬镜腿或笔表示想听更多；把眼镜放下表示不再听了。","个人空间：45厘米以内是亲密区；45厘米到1.2米是个人区；1.2米以外是公共区。人口密集国家的人能接受更近的距离；对方比你矮时要站远一点。","文化差异：除了微笑，大多数手势在不同文化里含义不同。","可以在机场观察陌生人，或者关掉电视声音练习。","如果对方也在研究你的肢体语言，可以模仿他的姿势；他察觉了，就说明他在读你。"],
e:"你在玻璃墙外等一位开发商打电话：他先翘脚、尖塔手势，很自信；突然坐直找笔，飞快记录；站起来靠着椅背；看到你后比了个「两分钟」的手势；然后摸了摸鼻子；最后笑着穿外套挂了电话。你听不到一个字，却比电话那头的人知道得更多。",
r:"",
s:"在广交会展位上，一个买家拿着你的样品反复看。",
p:"观察他看到报价时的变化：是否突然眨眼加快、摸后颈或放下样品。有变化时用开放式问题跟进：What do you think of the finish compared to what you are using now?",
k:["只读变化","别坐在对方两人中间","解扣子后再谈正事","眨眼、歪头、手到头部、眼镜信号","注意个人空间和文化差异"],
q:["以下哪个信号最值得重视？",["对方一直双臂交叉","对方习惯性摸鼻子","被问到价格时对方突然摸鼻子","对方穿西装"],2,"只有肢体语言的变化才是有效信号。"]},

{n:49,zh:"如果我们能提前交货，您能在出货前付清全部尾款吗？",t:"话里的潜台词",
c:"仔细听对方用的每一个词，特定的说法常常暴露真实意图。",
w:"总统讲外交时要念稿，因为每个字都会被分析。谈判中也一样：你要会分析对方的措辞，也要小心自己的。",
h:["奇怪的措辞要逐字记下，事后分析。","反话：「依我拙见」的人往往一点也不谦虚；「他是个好教友」可能是说他只有这一个优点；「细节以后再说」说明还有很多要谈；「别担心」表示你该担心了。","丢弃语：「如你所知」「顺便说一下」「在我忘记之前」，后面常跟着重大信息。","合理化语：「坦白说」「老实说」「事实上」，常用来让不完全真实的话显得可信。","推托语：「我尽力」「我看看能做什么」，是在为做不到铺路；从「我」变成「我们」时更要小心，这是在躲到集体背后。","抹除词：「但是」「不过」会抹掉前面所有的话。","欺骗句：「我只是个乡下人，但……」「我不懂法律，不过……」，说这话的人在这件事上往往非常懂。","铺垫语：「我不是想打听私事」，接下来一定会打听私事。","夸张法：「帮我个大大的忙」，然后只借50块，你会觉得很少。","试探气球：「我还没仔细想过，不过……」「假如我们……」，说明他能接受这个方案，你还可以再推一推。","感官偏好：视觉型的人说「看起来不错」，听觉型说「听起来不错」，感觉型说「感觉不错」。用他的词回应，对听觉型的人别说「看起来」。"],
e:"作者参与一次并购谈判时，对方总裁说：「如果我们去查某股东的信用，可能会发现他有财务问题。」措辞是「如果去查」，而不是「我们查过」或「你们也清楚」，作者由此判断他们公司里有人在泄露信息，后来用一连串问题让对方说出了内鬼的名字。",
r:"",
s:"买家邮件结尾写：By the way, we need the goods two weeks earlier than planned.",
p:"「By the way」后面通常是重点。把交期变化当作正式议题单独确认，并按第13章索取回报：If we can bring it forward, could you confirm the full balance before shipment?",
k:["丢弃语后面是重点","「坦白说」未必坦白","「我们会尽力」要警惕","「但是」抹掉前面","试探气球＝他能接受","用对方的感官词回应"],
q:["对方说「我还没仔细想过，不过如果我们……」，说明什么？",["他在随便说说","他能接受这个方案，而且你可能还能争取更多","他要拒绝你","他需要请示上级"],1,"试探气球说明对方已经缩小了自己的谈判范围。"]},

{n:50,t:"优势谈判者的个人特质",
c:"五种特质：敢于追问信息、有耐心、敢于开高价、坚持双赢的正直、愿意倾听。",
w:"好的谈判者不是凶狠的人，而是有耐心、不被时间逼着做坏交易的人。",
h:["敢追问：像调查记者一样问难题；同一个问题问不同的人；谈判过程中重复问，看答案是否一致。","有耐心：越南代表租了两年半的别墅。","敢开高价：克服对被嘲笑的恐惧。","坚持双赢：即使对方已经被你压在墙角，也继续找对他有价值、又不损害你立场的让步。","倾听：身体前倾，头微侧，提问，给反馈，复述对方的话。","把听当成互动，人听的速度比说的快四倍，用小游戏保持专注（比如找出每句最长的词）。","从一开始就记笔记，标日期和主题；对方看到你在记，会说得更准确。","先别急着评判对方，等他说完。","请对方先说结论，再请他支持结论。","意识到自己的偏见（比如讨厌被吹嘘）。","用中间画线的笔记本：左边记事实，右边记你的判断。"],
e:"作者宣传新书时，电视主持人说他「看着不像谈判专家」，意思是不够凶。作者说，好的谈判者恰恰是有耐心的人。",
r:"",
s:"和买家开视频会议。",
p:"准备一张中间画线的笔记：左边记对方说的事实（数量、目标价、时间），右边记你的判断（他可能在试探、他提到「by the way」）。",
k:["敢问、耐心、敢要、正直、倾听","记笔记，左事实右判断","先听完再评判"],
q:["分栏笔记法的两栏分别记什么？",["中文和英文","左边记事实，右边记你的判断","优点和缺点","价格和数量"],1,"把事实和判断分开，能减少偏见。"]},

{n:51,t:"优势谈判者的态度",
c:"能接受不确定、有韧性、有竞争心、不怕冲突。",
w:"谈判是在管理一个不断变化的局面。需要精确的人（工程师、会计、建筑师）往往觉得谈判难受。",
h:["接受不确定：小测验，去参加聚会前一定要知道见谁？吃饭前一定要知道去哪家？旅行要计划到每个细节？三个都选「是」，说明你需要多练习接受不确定。","练习方法：作者买了一张环球机票，一个月不提前订任何行程。","韧性：不是不受伤，而是受伤后能恢复，像塑料瓶被捏扁会弹回去，易拉罐不会。","竞争心：把谈判当游戏，在规则内全力争取。很多销售员打球时拼命赢客户，一谈价格就认怂。","不怕冲突：要的是对方尊重你，而不是喜欢你。总给孩子他要的一切，关系不会更好。"],
e:"作者和妻子在意大利阿马尔菲等去拉韦洛的巴士，人太多，他挤上车却把妻子留在了站台。半路一辆出租车超车拦住巴士，妻子上车大喊「Roger，你在车上吗？」，全车鼓掌。这就是韧性。",
r:"",
s:"你习惯把每一步都计划好，谈判中客户突然改变需求。",
p:"把变化当成正常的谈判过程：先确认新需求（问开放式问题），再重新报价，而不是慌张地马上让步。",
k:["接受不确定","有韧性","当成游戏，有竞争心","要尊重，不要讨好"],
q:["作者认为谈判者应该追求对方怎样看自己？",["喜欢自己","尊重自己","害怕自己","同情自己"],1,"过度需要被喜欢的人会害怕冲突。"]},

{n:52,zh:"除了价格，您在为这条产品线选择供应商时最看重什么？",t:"优势谈判者的信念",
c:"三个信念：压力是双向的；谈判有规则；「不」只是开场立场。",
w:"每一方都只知道自己身上的压力，不知道对方的，所以都以为自己是弱的一方。你永远比自己以为的更强。",
h:["去银行贷款时，想想银行花了多少广告费吸引你，信贷员可能正被老板催着放贷。","员工要求加薪时，你担心失去他，他担心影响前途，双方都觉得自己弱。","对方说「有五六家能做得更便宜、一样好」，别信：一定有什么原因让他来找你谈。","相信规则：先试这些招数，你会对效果感到意外。","「不」只是开场立场：「这是个有意思的开场，他为什么从这里开始？」"],
e:"作者在一场晚宴上对酒店经理用钳子策略，一瓶22.5美元的酒先降到15美元，再降到13.5美元。之前在课上听过这一招的银行总裁亲眼看到才信。",
r:"",
s:"大买家说：「我手上有六家供应商报价，都比你便宜。」",
p:"提醒自己：他还在和你谈，说明你有他需要的东西。然后用开放式问题找出他真正在意的点：Besides price, what matters most to you in choosing a supplier for this line?",
k:["你永远比自己以为的强","谈判有规则","「不」只是开场立场"],
q:["为什么谈判双方常常都觉得自己是弱势的一方？",["因为都不会谈判","因为每一方只知道自己的压力，不知道对方的","因为对方更强","因为市场不好"],1,"所以要在心里补偿这种偏差。"]},

{n:53,t:"合法力量（头衔与地位）",
c:"头衔、市场定位、法律、传统和既定程序都会让人服从；同时别被对方的头衔吓住。",
w:"头衔一授予就立刻带来力量。人们对副总裁、医生比对没有头衔的人更敬畏。",
h:["有头衔就用：名片、签名档上都写上。","用名字缩写，让不熟的人只能称你「某先生／女士」。","尽量在你的地盘谈判；用你的车、选你定的餐厅。","让助理帮你打电话（作者自己不喜欢，但确实能体现地位）。","市场定位也是力量：最大、最老、最新、最专业，怎么定位都行。","尊重法律：「我们的公司章程不允许这样」。","传统：「我们一直这么做」。","既定程序：价签、「这是我们的标准合同，大家都签这份」。","被头衔吓住时提醒自己：卖车的人是总裁，也不改变车的价值，他甚至可能因为不缺钱而更好说话。","很多头衔并没那么值钱：有的公司一个分部就有35个副总裁。"],
e:"作者在银行当柜员时，一位女士说她叔叔是美国银行副总裁，他很紧张。同事拿出一本像电话簿一样厚的副总裁名录给他看。",
r:"",
s:"你一个人做外贸，名片该怎么写？",
p:"用真实但有分量的头衔（比如 Sales Manager／Founder）；用标准合同和价目表建立「程序」的力量；在邮件签名里写清公司定位（例：专注户外收纳产品）。",
k:["头衔、定位、法律、传统、程序","在自己地盘谈","别被对方头衔吓住"],
q:["「这是我们的标准合同，所有客户都签这份」利用的是哪种力量？",["奖励力量","合法力量中的既定程序","个人魅力","强制力量"],1,"既定的做法本身就让人不太质疑。"]},

{n:54,zh:"我们专注于做面向美国市场的X产品，帮助像您这样的进口商减少破损索赔、缩短返单周期。",t:"奖励力量",
c:"让对方相信是你在奖励他（选择你是他的福气），而不是他在施舍你订单。",
w:"顶级刑事辩护律师让客户觉得「能请到他是运气」，所以收费极高。到处拉客户的律师则被看低。",
h:["奖励的形式不只是钱：表扬、原谅、授予头衔、安排工作、向有权的人推荐。","别靠低价卖：靠低价等于说「很多人都能解决你的问题，我只是便宜一点」。","相信自己是最好的，并且让客户也相信。","写下三个理由，说明对方为什么会因为选择你而受益；第一条应该是「他们得到了你」。","别乞求一点点订单，那像狗在讨桌上的残羹。","对方暗示奖励时（下周有个大项目、他的游艇、他的滑雪小屋），认出来，就不会被它左右。","第一次做时，一千美元的单子都让你紧张；做久了，十万美元才会让你兴奋，奖励的力量是主观的。"],
e:"作者所在的演讲者协会有3500名会员。有人问他竞争这么激烈怎么还敢收高价，他说「因为我讲得好」。",
r:"",
s:"写给新客户的开发信，第一段该强调什么？",
p:"强调你能为他解决的具体问题和你的专业，而不是「我们价格最低」：We specialise in X for the US market, and help importers like you reduce breakage claims and reorder lead time.",
k:["你在奖励客户","别靠低价卖","第一理由：他们得到了你","认出对方的暗示奖励"],
q:["为什么作者反对「靠最低价」销售？",["因为不赚钱","因为这等于承认很多人都能解决问题，你只是便宜","因为违法","因为客户不喜欢便宜"],1,"低价策略让你失去奖励力量。"]},

{n:55,zh:"本周确认可以锁定现在的价格和11月的生产档期。之后最早的档期是1月，会错过您的春季销售季。",t:"强制力量",
c:"只要你觉得对方能惩罚你，他就对你有力量。高手会把奖励和惩罚结合起来用。",
w:"被交警拦下时，罚款可能不多，但威慑力很大。强制力量的形式包括：嘲笑、让人难堪、泄露秘密、揭伤疤、分配苦差、浪费你的时间、限制你的前途。",
h:["奖惩结合：家长说「现在睡觉就给你讲故事」，「不吃胡萝卜就不能看电视」；销售讲好处，也温和地暗示不行动的风险。","粗暴的威胁（「五点修不好我就告你」）常常适得其反，赢了还炫耀更糟。","对方快要让步时，立刻切换到奖励：「太好了，非常感谢！」","写下三个理由，说明对方不选你会有什么损失：第一条应该是「他们得不到你」。","对被嘲笑的恐惧会阻止你开高价。克服的方法是积累经验，并明白销售是概率游戏。"],
e:"丘吉尔1940年的著名演讲，前面是绝不投降的鼓舞，最后一句却说即使本岛被征服，海外帝国也会继续战斗，直到新世界来解救。他同时用了奖励（希望）和惩罚（可能失败）。作者学滑雪时被朋友带到陡峭的雪檐边，在「被嘲笑」和「可能摔死」之间，他选了后者，可见怕被嘲笑的力量有多大。",
r:"",
s:"一个犹豫的买家迟迟不确认订单。",
p:"同时用奖励和风险：Confirming this week secures the current price and the November production slot. After that, our next available slot is January, which would miss your spring season.",
k:["觉得对方能惩罚你，他就有力量","奖惩结合","粗暴威胁会适得其反","销售是概率游戏"],
q:["丘吉尔演讲的例子说明了什么？",["只用鼓舞就够了","奖励和惩罚结合更有说服力","威胁最有效","不要提失败"],1,"他既给了希望，也指出了可能的失败。"]},

{n:56,zh:"我理解您想降低成本，但根据我们发往您港口的经验，更薄的纸箱会带来破损索赔。我们宁可不提供明知会给您带来问题的东西。",t:"崇敬力量（一致的价值观）",
c:"坚持一套前后一致、不轻易改变的价值观，会让人信任你。这是最持久的影响力。",
w:"奖励会让人习惯，强制用久了会反弹，而一致的价值观带来的信任会越积越多。",
h:["为客户的最佳利益坚持原则，哪怕自己会少赚：「我知道您想省钱，但这款配置达不到您的要求，我不能卖给您更低配的。」","医生说要做四根搭桥，你说三根行不行，他说好，你还敢让他动刀吗？","不要定下标准又自己打破：说过不降价，结果降了，比不定标准更糟。","对方用这招对你（「我们的创始人说过永不打折」），有两种应对：①找出先例，「你们西雅图的分店给我破过例」；②说明这条规则已经不合时宜，竞争对手都在打折了。"],
e:"一家世界500强企业多年坚持「创始人定下的永不偏离价目表」，直到竞争对手开始打折，它也只好跟进。",
r:"找先例，或者说明规则已经过时。",
s:"客户要求你用更薄的纸箱来降价，你知道这会导致破损。",
p:"I understand you want to reduce cost, but based on our shipping experience to your port, a thinner carton will lead to damage claims. We would rather not offer something we know will cause problems for you.",
k:["一致的价值观建立信任","越用越强","别自己破坏标准","对付它：找先例或说明规则已过时"],
q:["对方说「我们从不破例」，你可以怎么应对？",["马上放弃","找出他们曾经破例的先例","生气离开","接受所有条件"],1,"先例能瓦解对方的崇敬力量。"]},

{n:57,t:"个人魅力力量",
c:"魅力不是天生的，而是能让对方感到你真心在乎他。别因为喜欢一个人就让步。",
w:"魅力的反面是极度以自我为中心的人。所以魅力来自关心你遇到的每个人。",
h:["把你今天遇到的每个人都当成今天最重要的人（不是一辈子最重要的，那就太夸张了）。","不能对副总裁恭敬，却把秘书当佣人。","销售员常高估「客户喜欢我」：被喜欢有帮助，但并不能让你控制谈判。","对方的魅力让你想让步时，问自己：「如果我很讨厌这个人，我还会做这个让步吗？」"],
e:"作者在政治立场上和克林顿相反，见面时只说了句「祝你好运，别被他们打倒」。克林顿看着他说「Roger，你挺我，我就会坚持住」，作者脱口说「我会的」，15秒就被争取了。另一位见过克林顿的人说，房间里40个人，每个人都觉得他是专门来见自己的。",
r:"「如果我讨厌这个人，我还会让步吗？」",
s:"一位很健谈、很热情的买家，每次聊完你都想再给他点优惠。",
p:"让步前先问自己书中那个问题。热情要回应，但让步仍要换回报（第13章）。",
k:["魅力＝真心关心每个人","每个人都当作今天最重要的人","别因为喜欢就让步"],
q:["被对方的魅力打动想让步时，作者建议问自己什么？",["他会不会生气？","如果我讨厌这个人，我还会让步吗？","他喜欢我吗？","我能多赚多少？"],1,"把喜欢从决策里剥离出来。"]},

{n:58,zh:"这个问题最好由我们的质检工程师来回答。我明天给您一个准确答复，并附上测试报告。",t:"专业力量",
c:"让对方感到你比他更懂，你就有力量。在技术变化越来越快的世界，专业力量越来越重要。",
w:"影响他人的三大因素是暴力（强制力量）、财富（奖励力量）和知识（专业力量）。专业力量胜过前两者：强制力量只能偶尔用，奖励会贬值，专业会不断增长。",
h:["持续学习，去年的知识今年不够用。","对方用专业压你时：「这不是我负责的领域，但我们的专家是业内最好的，你完全可以放心。」","律师、医生用行话制造神秘感来体现专业，你也可以理解这种做法，但别被它吓住。"],
e:"作者需要13岁的外孙女教他用iPhone，他承认未来会有越来越多需要求助专家的事。",
r:"「这不是我的专业领域，但我们的专家是最好的。」",
s:"买家用一堆你不熟的认证术语问你。",
p:"That is a good question for our QC engineer. Let me get you an exact answer by tomorrow, including the test report.",
k:["专业力量不断增长","持续学习","别被对方的专业吓住"],
q:["作者认为三大影响力中哪种最强？",["强制（暴力）","奖励（财富）","专业（知识）","三者一样"],2,"专业会不断增长，而奖励会贬值，强制只能偶尔用。"]},

{n:59,t:"情境力量",
c:"平时没什么权力的人，在某个特定情境下能卡住你，而且他们乐于用。",
w:"大机构、政府部门里的人日常很少能自己做主，一旦有机会控制你，就会享受它。",
h:["如果对方的情境力量大到你注定要让步，那就体面地让，保住对方的好感。","同理，你自己要给别人让步时，也别说「这次就破例，但这不是我们的规定」这种话。","认出情境力量，不要生气，转向你能控制的领域。"],
e:"一个参加完派对、凌晨3点只穿着内裤去取冰块的人，门在身后锁上了。他只好走过酒店大堂去要钥匙，前台说：「先生，我需要看一下您的身份证件。」作者公司刚浇完地基混凝土，检查员说没签字的管道不能浇，他们只好赶在混凝土凝固前挖开。",
r:"",
s:"港口或海关的操作人员卡住你的货，要求补一份文件。",
p:"不争执，礼貌配合并尽快补齐。同时把精力放在你能控制的部分，比如提前通知客户新的到港时间。",
k:["小人物在特定情境有权","注定要让就体面地让","别生气，转向可控的部分"],
q:["面对注定赢不了的情境力量，作者建议？",["据理力争到底","体面地让步，保住好感","投诉","放弃整单"],1,"反正要让，不如让得漂亮。"]},

{n:60,t:"信息力量",
c:"分享信息会拉近关系，扣住信息会让人不安。",
w:"医药代表很难见到医生，但如果每次都带来一份新研究，分享信息就会让医生和他建立联系。互联网时代，信息很容易获得，扣住信息的力量已经弱了。",
h:["分享有价值的信息来建立关系（行业动态、市场数据）。","大公司会在高层保留一些不那么机密的信息，以此控制员工。","给出指示时，就当它是你自己的决定，不说「上面让我这么做」（这是美国海军训练手册的建议）。","对方让你去大厅等他们内部讨论时，别不安：他们可能只是在聊球赛，这也可能是一招。"],
e:"",
r:"被晾在外面等时，告诉自己：这可能只是一个招数。",
s:"想和一个潜在大客户建立联系。",
p:"每次跟进都带一条对他有用的信息，比如他所在市场的季节性需求变化、新的包装法规，而不是只问「有订单吗」。",
k:["分享信息建立联系","扣住信息让人不安","把指示说成自己的决定","被晾着时别慌"],
q:["对方说「我们内部讨论一下，请你在外面稍等」，你应该怎么想？",["他们一定在否决我","这可能只是让我不安的一招","我应该马上降价","我该离开"],1,"认清这一招，它就吓不到你。"]},

{n:61,t:"力量的组合",
c:"给自己的八种力量打分；某些力量组合起来威力巨大。",
w:"八种力量：合法、奖励、强制、崇敬、魅力、专业、情境、信息。这也是对方用来压你的八种方式。",
h:["按别人眼中的你，给每种力量打1到10分，总分80。","60多分最理想：有力量又有同理心；70以上可能太咄咄逼人；60以下要补短板。","谈判中觉得被压制时，找出是哪种力量在起作用，认出来就好应对。","崇敬＋魅力＋专业：对方会问「你是专家，你说我们该怎么做？」，这就等于把决定权交给了你。","合法＋奖励＋崇敬＋魅力：四者集于一身，影响力惊人，既可能用于善，也可能用于恶。"],
e:"作者以历史人物为例说明，四种力量集于一身时，可能被用来做极坏的事，也可能成就最受欢迎的领导人。",
r:"",

{n:63,zh:"有什么能帮您在内部汇报这件事吗？我可以为您的财务团队准备一份成本对比，展示总到岸成本和次品节省。",t:"谈判动机",

w:"社会学家称这种错误为「社会中心主义」：以为对方想要的就是你站在他的位置会想要的。福特公司一位劳资谈判负责人说：一次性交易可以只看结果；长期关系，胜利就是让双方都满意。",
h:["竞争型：只想赢，尽量了解你却不透露自己，不信你给的信息，会私下找你的员工打听。这种情况下很难双赢。","解决型：真心想找到最好方案，愿意考虑各种创意。买房时就可以设计很多变量：承接原贷款、卖方提供融资、租回、附带家具、终身居住权、延期交割等。但要警惕：竞争型可能伪装成解决型，等你亮出底牌再翻脸。","个人型：真正的动机是他个人的利益或面子。按小时收费的律师不急着解决；年轻的谈判代表不想空手回公司（你可以拖到他的期限）；工会代表要向会员交代（这时你开一个离谱的价反而帮了他）。","组织型：他认可方案，但必须能向组织交代。主动想一想：谁会让他头疼？股东？法务？监管？然后帮他让方案更好交代，比如你在公开场合立场更强硬，桌上的妥协就显得更有分量。","态度型：相信只要彼此信任喜欢就能解决，一定要面对面。容易被骗，变成绥靖。要做的是找到对双方都真正有利的方案，那样喜不喜欢彼此就不重要了。"],

r:"",

{n:64,zh:"价格只是其中一部分。我们也可以看看订货量的阶梯价、60/40的付款比例、纸箱标签，以及1%的备品额度，找到一个对双方都合适的整体方案。",t:"双赢谈判",

w:"双赢不是双方让得一样多，也不是得到一样多。前面所有招数（不接受第一次报价、开高价、吃惊、不对抗、不情愿、钳子、请示上级、白脸黑脸、不主动折中、暂置、索取回报、让步递减、欣然接受），都是在营造「对方赢了」的感觉。",
h:["规则一：别把谈判缩到只剩一个议题。只剩价格时，必然有人输。买家想把你的产品当大宗商品只谈价格时，把交期、条款、包装、质保都放到桌上，这叫做大蛋糕，而不是切蛋糕。","规则二：对方要的不一定和你一样。价格往往不是最重要的：质量、准时交货、管理支持、付款灵活、财务实力、员工素质都满足了，价格才成为决定因素。","规则三：别贪最后一块钱。","规则四：成交后多做一点，多一点服务、多一点关心，对方没争取就得到的东西，比争取到的更让他珍惜。","优势谈判者的信条：别想「我能让他给我什么」，要想「我能给他什么，对他有价值又不损害我的立场」。给人们想要的，他们就会给你想要的。"],

r:"",

k:["都觉得赢＝双赢","别只剩一个议题，做大蛋糕","对方要的不同","别贪最后一块钱","成交后多给一点"],
q:["谈判只剩价格一个议题时，作者建议怎么做？",["坚持到底","各让一半","加入交期、付款、包装等其他议题","放弃"],2,"单一议题必有输赢，加入议题才能交换。"]},

{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="yspt-v1";
let st={done:[],known:[],last:1,best:null,answered:{}};
try{const r=localStorage.getItem(KEY);if(r)st=Object.assign(st,JSON.parse(r));}catch(e){}
let remote=null,busy=false,dirty=false;
const sy=t=>{const e=document.querySelector("#sy");if(e)e.textContent=t;};
async function push(){
  if(!remote)return;
  if(busy){dirty=true;return;}
  busy=true;
  try{await remote.set(JSON.parse(JSON.stringify(st)));sy("已同步到你的Claude账号，换设备也能接着学");}
  catch(e){sy("同步暂时失败，进度先保存在本机");}
  busy=false;
  if(dirty){dirty=false;push();}
}
let pt=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}if(remote){clearTimeout(pt);pt=setTimeout(push,800);}};
const uni=(a,b)=>Array.from(new Set([...(a||[]),...(b||[])])).filter(x=>typeof x==="number");
async function initSync(){
  const C=window.claude;if(!C||!C.use)return;
  try{
    const d=await C.use("desktop");
    if(d&&d.install&&(await d.install.state())==="available"){
      const b=document.querySelector("#inst");b.hidden=false;
      b.addEventListener("click",()=>{d.install.request().then(r=>{if(r==="installed")b.hidden=true;}).catch(()=>{});});
    }
  }catch(e){}
  try{
    const [db,user]=await Promise.all([C.use("db"),C.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    sy("正在连接账号……");
    const ref=db.doc("data/users/"+uid+"/progress");
    const timer=setTimeout(()=>sy("暂时连不上账号，进度先保存在本机"),10000);
    const snap=await ref.get();clearTimeout(timer);
    if(snap.exists){
      const r=snap.data()||{};
      st.done=uni(st.done,r.done);st.known=uni(st.known,r.known);
      if(typeof r.best==="number"&&(st.best==null||r.best>st.best))st.best=r.best;
      if(r.answered&&typeof r.answered==="object"){for(const k in r.answered){if(st.answered[k]==null&&typeof r.answered[k]==="number")st.answered[k]=r.answered[k];}}
      if(typeof r.last==="number"&&!location.hash){cur=r.last;st.last=r.last;}
      try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}
      route();
    }
    remote=ref;await push();
  }catch(e){sy("暂时连不上账号，进度先保存在本机");}
}
const byN=n=>CH.find(c=>c.n===n);
const secOf=n=>SECTIONS.find(s=>n>=s.from&&n<=s.to);
let cur=st.last||1;

function drawBoard(){
  let h="";
  for(let i=1;i<=64;i++){
    const r=Math.floor((i-1)/8),c=(i-1)%8,dark=(r+c)%2===1,d=st.done.includes(i);
    const ch=byN(i);
    h+=`<button class="sq ${dark?"d":"l"}${d?" done":""}${i===cur?" cur":""}" data-n="${i}" title="第${i}章 ${esc(ch.t)}" aria-label="第${i}章 ${esc(ch.t)}${d?"，已掌握":""}">${i}${d?'<span class="tick">✓</span>':""}</button>`;
  }
  $("#board").innerHTML=h;
  $("#b0").classList.toggle("on",cur===0);$("#b65").classList.toggle("on",cur===65);
  const s=secOf(cur);
  $("#legend").innerHTML=SECTIONS.map(x=>`<button data-s="${x.from}" class="${s&&s.id===x.id?"on":""}">${esc(x.short)} ${x.from===x.to?"":x.from+"–"+x.to}</button>`).join("");
  const n=st.done.filter(x=>x>=1&&x<=64).length;
  $("#pc").textContent=n;$("#pb").style.width=(n/64*100)+"%";
  $("#pq").textContent=st.best!=null?`测验最佳 ${st.best}/10`:"";
}

function lesson(n){
  const c=byN(n);if(!c)return lesson(1);
  cur=n;st.last=n;save();
  const s=secOf(n),done=st.done.includes(n);
  const ans=st.answered[n];
  const label=n===0?"引言":n===65?"结论":`第${n}章`;
  let h=`<article class="lesson">
  <p class="crumb">${esc(s.name)} · ${label}</p>
  <h2>${esc(c.t)}</h2>
  <p class="core">${esc(c.c)}</p>
  <h3><span class="dot"></span>为什么有效</h3><p>${esc(c.w)}</p>
  <h3><span class="dot"></span>${n===0||n===65?"要点展开":"具体怎么做"}</h3><ol>${c.h.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
  if(c.e)h+=`<h3><span class="dot"></span>书中的例子</h3><div class="box"><p>${esc(c.e)}</p></div>`;
  if(c.r)h+=`<h3><span class="dot"></span>别人对你用这招时</h3><div class="box"><p>${esc(c.r)}</p></div>`;
  if(c.x)h+=`<h3><span class="dot"></span>诚信提醒</h3><div class="box warn"><p>${esc(c.x)}</p></div>`;
  h+=`<h3><span class="dot"></span>用到外贸上</h3><div class="trade"><p class="sc">场景：${esc(c.s)}</p>`;
  if(c.p)h+=c.zh?`<p class="lab">英文原句（可直接发给买家）</p><div class="script" id="scr">${esc(c.p)}</div><p class="lab">中文意思</p><div class="script zh">${esc(c.zh)}</div><button class="btn copy" id="cp">复制英文话术</button>`:`<div class="script" id="scr">${esc(c.p)}</div><button class="btn copy" id="cp">复制话术</button>`;
  h+=`</div>
  <h3><span class="dot"></span>要记住的要点</h3><ul class="keys">${c.k.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  <h3><span class="dot"></span>小测</h3><div class="q"><p class="qt">${esc(c.q[0])}</p><div class="opts">${c.q[1].map((o,i)=>`<button class="opt" data-i="${i}">${"ABCD"[i]}. ${esc(o)}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div></div>
  <div class="nav">${n>0?`<button class="btn" data-go="${n-1}">← 上一章</button>`:""}<span class="sp"></span>
  <button class="btn ${done?"done":"pri"}" id="mk">${done?"✓ 已掌握（点击取消）":"标记为已掌握"}</button>
  ${n<65?`<button class="btn" data-go="${n+1}">下一章 →</button>`:""}</div></article>`;
  $("#view").innerHTML=h;
  if(ans!=null)showAns(c,ans);
  drawBoard();
}
function showAns(c,i){
  const right=c.q[2];
  document.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.i;b.disabled=true;if(k===right)b.classList.add("right");else if(k===i)b.classList.add("wrong");});
  $("#fb").innerHTML=`<b>${i===right?"答对了。":"再想想：正确答案是 "+"ABCD"[right]+"。"}</b> ${esc(c.q[3])}`;
}

let deck=[],di=0,flipped=false,cfilter="all";
function buildDeck(){
  const pool=CH.filter(c=>c.n>=1&&c.n<=64&&(cfilter==="all"||secOf(c.n).id===+cfilter));
  const unk=pool.filter(c=>!st.known.includes(c.n)),kn=pool.filter(c=>st.known.includes(c.n));
  deck=unk.concat(kn);di=0;flipped=false;
}
function cards(){
  if(!deck.length)buildDeck();
  const c=deck[di];
  const opts=`<option value="all">全部章节</option>`+SECTIONS.filter(s=>s.from>=1&&s.to<=64).map(s=>`<option value="${s.id}" ${cfilter==s.id?"selected":""}>${esc(s.name)}</option>`).join("");
  const kn=deck.filter(x=>st.known.includes(x.n)).length;
  $("#view").innerHTML=`<h2>闪卡</h2>
  <div class="row" style="justify-content:flex-start;margin:0 0 18px"><label for="cf" class="sub">范围</label><select id="cf">${opts}</select><span class="sub">已记住 ${kn} / ${deck.length}，没记住的排在前面</span></div>
  <div class="card${flipped?" flip":""}" id="card"><div class="inner">
  <div class="face front"><div class="no">第${c.n}章 · ${esc(secOf(c.n).short)}</div><div class="ti">${esc(c.t)}</div><div class="no" style="margin-top:18px">先自己说出核心做法，再点卡片翻面</div></div>
  <div class="face back"><p class="cc">${esc(c.c)}</p><ul class="keys">${c.k.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${c.p?`<p class="script" style="margin-top:12px">${esc(c.p)}</p>`:""}${c.zh?`<p class="script zh">${esc(c.zh)}</p>`:""}</div>
  </div></div>
  <div class="row"><button class="btn" id="cprev">←</button><button class="btn" id="cflip">翻面</button><button class="btn" id="cno">还不熟</button><button class="btn pri" id="cyes">记住了</button><button class="btn" id="cnext">→</button></div>
  <p class="meta">${di+1} / ${deck.length}　·　<a href="#ch-${c.n}">去读这一章</a></p>`;
}

let qz=null;
function newQuiz(){
  const pool=CH.filter(c=>c.n>=1&&c.n<=64).map(c=>c.n);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  qz={list:pool.slice(0,10),i:0,score:0,wrong:[],picked:null};
}
function quiz(){
  if(!qz)newQuiz();
  if(qz.i>=qz.list.length){
    if(st.best==null||qz.score>st.best){st.best=qz.score;save();drawBoard();}
    $("#view").innerHTML=`<h2>测验完成</h2><div class="score">${qz.score}<span style="font-size:24px"> / 10</span></div>
    <p>${qz.score>=9?"非常扎实，可以去做一次真实谈判的复盘了。":qz.score>=6?"大部分掌握了，把错题对应的章节再读一遍。":"建议先回到棋盘，从开局招数逐章学起。"}</p>
    ${qz.wrong.length?`<h3><span class="dot"></span>错题回顾</h3><ul>${qz.wrong.map(n=>`<li><a href="#ch-${n}">第${n}章 ${esc(byN(n).t)}</a></li>`).join("")}</ul>`:""}
    <div class="nav"><button class="btn pri" id="qagain">再来10题</button></div>`;return;
  }
  const c=byN(qz.list[qz.i]);
  $("#view").innerHTML=`<h2>随机测验</h2><p class="crumb">第 ${qz.i+1} / 10 题 · 当前得分 ${qz.score}</p>
  <div class="q" style="margin-top:16px"><p class="qt">${esc(c.q[0])}</p><div class="opts">${c.q[1].map((o,i)=>`<button class="opt qo" data-i="${i}">${"ABCD"[i]}. ${esc(o)}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div></div>
  <div class="nav"><span class="sp"></span><button class="btn pri" id="qnext" ${qz.picked==null?"disabled":""}>${qz.i===9?"看结果":"下一题 →"}</button></div>`;
  if(qz.picked!=null){showAns(c,qz.picked);$("#fb").insertAdjacentHTML("beforeend",` <a href="#ch-${c.n}">（来自第${c.n}章）</a>`);}
}

let qtext="";
function ref(){
  const t=qtext.trim().toLowerCase();
  const rows=CH.filter(c=>!t||(c.t+c.c+c.p+(c.zh||"")+c.k.join("")).toLowerCase().includes(t));
  $("#view").innerHTML=`<h2>速查表</h2><div class="row" style="justify-content:flex-start;margin:0 0 16px"><label for="rs" class="sub">搜索</label><input type="search" id="rs" placeholder="例如：账期、上级、沉默" value="${esc(qtext)}"><span class="sub">${rows.length} 条</span></div>
  <div class="scroll"><table class="stack"><thead><tr><th>章</th><th>招数</th><th>一句话</th><th>外贸话术</th></tr></thead><tbody>
  ${rows.map(c=>`<tr><td data-l="章">${c.n===0?"引言":c.n===65?"结论":c.n}</td><td data-l="招数"><a href="#ch-${c.n}">${esc(c.t)}</a></td><td data-l="一句话">${esc(c.c)}</td><td data-l="外贸话术" class="en">${esc(c.p||"—")}${c.zh?`<div class="zhr">${esc(c.zh)}</div>`:""}</td></tr>`).join("")}
  </tbody></table></div>`;
  const i=$("#rs");i.addEventListener("input",e=>{qtext=e.target.value;const p=e.target.selectionStart;ref();const n=$("#rs");n.focus();n.setSelectionRange(p,p);});
}

function route(){
  const h=location.hash.slice(1);let v="ch";
  if(h==="cards"){v="cards";cards();}
  else if(h==="quiz"){v="quiz";quiz();}
  else if(h==="ref"){v="ref";ref();}
  else{const m=h.match(/^ch-(\d+)$/);lesson(m?+m[1]:cur);}
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  $("#tabs a[data-v=ch]").setAttribute("href","#ch-"+cur);
  if(v!=="ch")drawBoard();
}
const go=n=>{location.hash="ch-"+n;window.scrollTo({top:0});};

$("#board").addEventListener("click",e=>{const b=e.target.closest(".sq");if(b)go(+b.dataset.n);});
$("#b0").addEventListener("click",()=>go(0));
$("#b65").addEventListener("click",()=>go(65));
$("#legend").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(+b.dataset.s);});
$("#view").addEventListener("click",e=>{
  const t=e.target;
  const g=t.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  if(t.id==="mk"){const i=st.done.indexOf(cur);if(i>=0)st.done.splice(i,1);else st.done.push(cur);save();lesson(cur);return;}
  if(t.id==="cp"){const txt=$("#scr").textContent;try{navigator.clipboard.writeText(txt).then(()=>{t.textContent="已复制";},()=>{t.textContent="请手动选择复制";});}catch(err){t.textContent="请手动选择复制";}return;}
  const o=t.closest(".opt");
  if(o&&!o.disabled){
    const i=+o.dataset.i;
    if(o.classList.contains("qo")){const c=byN(qz.list[qz.i]);qz.picked=i;if(i===c.q[2])qz.score++;else qz.wrong.push(c.n);quiz();}
    else{st.answered[cur]=i;save();showAns(byN(cur),i);}
    return;
  }
  if(t.id==="qnext"){qz.i++;qz.picked=null;quiz();return;}
  if(t.id==="qagain"){newQuiz();quiz();return;}
  if(t.closest("#card")||t.id==="cflip"){flipped=!flipped;$("#card").classList.toggle("flip",flipped);return;}
  if(t.id==="cnext"){di=(di+1)%deck.length;flipped=false;cards();return;}
  if(t.id==="cprev"){di=(di-1+deck.length)%deck.length;flipped=false;cards();return;}
  if(t.id==="cyes"||t.id==="cno"){const n=deck[di].n,k=st.known.indexOf(n);if(t.id==="cyes"&&k<0)st.known.push(n);if(t.id==="cno"&&k>=0)st.known.splice(k,1);save();di=(di+1)%deck.length;flipped=false;cards();return;}
});
$("#view").addEventListener("change",e=>{if(e.target.id==="cf"){cfilter=e.target.value;buildDeck();cards();}});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea"))return;
  const h=location.hash.slice(1);
  if(h==="cards"&&deck.length){if(e.key==="ArrowRight"){di=(di+1)%deck.length;flipped=false;cards();}else if(e.key==="ArrowLeft"){di=(di-1+deck.length)%deck.length;flipped=false;cards();}else if(e.key===" "){e.preventDefault();flipped=!flipped;$("#card").classList.toggle("flip",flipped);}}
  else if(!h||h.startsWith("ch-")){if(e.key==="ArrowRight"&&cur<65)go(cur+1);else if(e.key==="ArrowLeft"&&cur>0)go(cur-1);}
});
window.addEventListener("hashchange",route);
route();
setTimeout(initSync,0);
}
</script>
</body>
</html>
